# Runs behind the VPS's existing Traefik (host network, Docker provider, letsencrypt resolver).
name: clawd
services:
  clawd:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      CLAWD_DATA_DIR: /data
    volumes:
      - clawd-data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.clawd.entrypoints=websecure
      - traefik.http.routers.clawd.rule=Host(`${CLAWD_HOST}`)
      - traefik.http.routers.clawd.tls=true
      - traefik.http.routers.clawd.tls.certresolver=letsencrypt
      - traefik.http.routers.clawd.middlewares=clawd-auth
      - traefik.http.middlewares.clawd-auth.basicauth.users=${CLAWD_BASIC_AUTH}
      - traefik.http.services.clawd.loadbalancer.server.port=3000

volumes:
  clawd-data:
