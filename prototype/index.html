<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clawd Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #faf9f5;
    --surface: #ffffff;
    --sunk: #f0eee6;
    --line: #e8e6dc;
    --muted: #6b6a64;
    --text: #141413;
    --accent: #d97757;
    --accent-ink: #b0502c;
    --accent-soft: #f6e4dc;
    --green: #788c5d;
    --green-ink: #56683f;
    --green-soft: #e7ecdf;
    --side: #f7f6f2;
    --side-ink: #3d3d3a;
    --shadow: 0 1px 2px rgba(20, 20, 19, .06), 0 8px 24px rgba(20, 20, 19, .08);
    --ui: "Poppins", "Helvetica Neue", Arial, sans-serif;
    --read: "Lora", Georgia, "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #1c1b19; --surface: #262522; --sunk: #211f1d; --line: #3a3935;
      --muted: #a3a19a; --text: #f0eee6; --accent-ink: #e8906f; --accent-soft: #3d2a22;
      --green-ink: #a3b788; --green-soft: #2a3122; --side: #201f1d; --side-ink: #d6d4cc;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1c1b19; --surface: #262522; --sunk: #211f1d; --line: #3a3935;
    --muted: #a3a19a; --text: #f0eee6; --accent-ink: #e8906f; --accent-soft: #3d2a22;
    --green-ink: #a3b788; --green-soft: #2a3122; --side: #201f1d; --side-ink: #d6d4cc;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: var(--ui); font-size: 14px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: default; opacity: .5; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { height: 100%; display: grid; grid-template-rows: auto 1fr; }

  .banner {
    display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between;
    padding: 8px 16px; background: var(--text); color: var(--bg); font-size: 12px;
  }
  .banner strong { font-weight: 600; letter-spacing: .02em; }
  .banner-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .banner button { background: none; border: 1px solid currentColor; border-radius: 6px; padding: 3px 10px; font-size: 12px; color: var(--bg); }
  .lang-switch { display: inline-flex; border: 1px solid currentColor; border-radius: 6px; overflow: hidden; }
  .banner .lang-switch button { border: 0; border-radius: 0; padding: 3px 8px; font-weight: 500; letter-spacing: .04em; }
  .banner .lang-switch button[aria-pressed="true"] { background: var(--bg); color: var(--text); }

  .main { display: grid; grid-template-columns: 272px minmax(0, 1fr) 320px; min-height: 0; }
  .main.no-panel { grid-template-columns: 272px minmax(0, 1fr) 0; }

  /* Sidebar, modelled on the Claude desktop app */
  .sidebar { border-right: 1px solid var(--line); background: var(--side); display: flex; flex-direction: column; gap: 2px; padding: 14px 10px 16px; min-height: 0; overflow-y: auto; }
  .ico { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .side-top { display: flex; align-items: center; gap: 4px; padding: 0 2px 14px; }
  .side-top .hist { display: flex; gap: 2px; }
  .top-btn { background: none; border: 0; border-radius: 8px; padding: 5px; color: var(--muted); display: grid; place-items: center; }
  .top-btn:hover { background: var(--line); color: var(--text); }
  .top-btn.dim { opacity: .45; }
  .mode { margin-left: auto; display: flex; background: var(--line); border-radius: 12px; padding: 3px; gap: 2px; }
  .mode-btn { background: none; border: 0; border-radius: 9px; padding: 5px 12px; color: var(--muted); display: grid; place-items: center; }
  .mode-btn.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(20,20,19,.12); }
  .close-nav { display: none; margin-left: auto; background: none; border: 0; font-size: 22px; line-height: 1; padding: 4px; }
  .chat-head .menu-btn { display: none; flex: none; }
  .side-btn { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: none; border: 0; border-radius: 10px; padding: 8px 10px; font-size: 15px; color: var(--side-ink); }
  .side-btn:hover { background: var(--line); }
  .side-btn .ico { color: var(--side-ink); }
  .side-btn.new { margin-bottom: 2px; }
  .side-btn.active { background: var(--line); color: var(--text); font-weight: 500; }
  .side-btn.active .ico { color: var(--text); }
  .side-btn.more, .side-btn.more .ico { color: var(--muted); }
  .mini-clawd { width: 20px; flex: none; display: grid; place-items: center; }
  .mini-clawd svg { width: 20px; height: auto; display: block; }
  .clawd-nav { color: var(--text); }
  .nav-badge { margin-left: auto; font-size: 10px; font-weight: 600; letter-spacing: .04em; color: var(--accent-ink); background: var(--accent-soft); border-radius: 999px; padding: 1px 7px; }
  .side-label { font-size: 12px; color: var(--muted); padding: 18px 10px 4px; }
  .side-empty { font-size: 12px; color: var(--muted); padding: 4px 10px; margin: 0; }
  .recent { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--line); }
  .me { margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 12px 10px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 600; }

  /* Chat */
  .chat { position: relative; display: grid; grid-template-rows: auto 1fr auto; min-height: 0; overflow: hidden; }
  .chat-head { display: flex; align-items: center; gap: 12px; padding: 12px 24px; border-bottom: 1px solid var(--line); }
  .chat-title { font-weight: 500; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12px; color: var(--muted); background: var(--surface); }
  .thread { overflow-y: auto; padding: 24px; }
  .thread-inner { width: 100%; max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  .main:not(.ftue-on) .thread-inner { padding-bottom: 56px; } /* room for Clawd sitting on the composer, so it never covers the last message */
  .hello { text-align: center; padding: 40px 0 8px; display: flex; flex-direction: column; gap: 16px; align-items: center; }
  .hello h1 { font-family: var(--read); font-weight: 400; font-size: 32px; margin: 0; text-wrap: balance; }
  .suggest { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .suggest button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-size: 13px; }
  .suggest button:hover { border-color: var(--accent); }
  .hello .ask { margin: -6px 0 0; color: var(--muted); font-size: 15px; }
  .situations { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; text-align: left; }
  .situation { display: flex; flex-direction: column; align-items: flex-start; text-align: left; gap: 4px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--text); font: inherit; min-height: 92px; }
  .situation:hover, .situation:focus-visible { border-color: var(--accent); }
  .situation .ic { font-size: 20px; line-height: 1; }
  .situation .t { font-size: 14px; font-weight: 500; line-height: 1.3; }
  .situation .d { font-size: 12px; color: var(--muted); line-height: 1.35; }
  .msg-user { align-self: flex-end; max-width: 85%; background: var(--sunk); border: 1px solid var(--line); border-radius: 16px 16px 4px 16px; padding: 12px 16px; white-space: pre-wrap; font-size: 14px; line-height: 1.55; }
  .msg-claude { font-family: var(--read); font-size: 16px; line-height: 1.65; white-space: pre-wrap; }
  .msg-claude .who { font-family: var(--ui); font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; margin-bottom: 6px; white-space: normal; }
  .tag { font-family: var(--ui); font-size: 11px; font-weight: 500; border-radius: 999px; padding: 2px 8px; }
  .tag.before { background: var(--sunk); color: var(--muted); border: 1px solid var(--line); }
  .tag.after { background: var(--green-soft); color: var(--green-ink); }
  .tag.offline { background: var(--accent-soft); color: var(--accent-ink); }
  .notes { margin-top: 12px; font-family: var(--ui); font-size: 13px; line-height: 1.55; background: var(--green-soft); border-radius: 10px; padding: 10px 14px; }
  .notes b { color: var(--green-ink); font-weight: 600; display: block; margin-bottom: 2px; }
  .thinking { color: var(--muted); font-style: italic; }
  .sys { align-self: center; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 12px; font-size: 12px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
  .compare-btn { align-self: center; border: 1px solid var(--accent); color: var(--accent-ink); background: var(--surface); border-radius: 999px; padding: 8px 16px; font-weight: 500; }
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .compare > div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; font-family: var(--read); font-size: 14px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
  .compare h3 { font-family: var(--ui); font-size: 12px; margin: 0 0 8px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .compare .b h3 { color: var(--muted); }
  .compare .a { border-color: var(--green); }
  .compare .a h3 { color: var(--green-ink); }

  .composer-wrap { padding: 12px 24px 20px; }
  .composer { max-width: 720px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 12px 12px 8px 16px; }
  .composer textarea { width: 100%; border: 0; resize: none; background: none; color: var(--text); font: 14px/1.5 var(--ui); min-height: 64px; max-height: 160px; outline: none; }
  .composer-row { display: flex; align-items: center; gap: 8px; }
  .icon-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: 16px; line-height: 1; }
  .send { margin-left: auto; width: 34px; height: 34px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; font-size: 16px; }
  .ftue-on .composer-wrap { opacity: .35; pointer-events: none; }
  .attach { display: flex; align-items: center; gap: 8px; width: max-content; max-width: 100%; margin-bottom: 8px; padding: 4px 6px 4px 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--sunk); font-size: 12px; color: var(--muted); }
  .attach[hidden] { display: none; }
  .attach img, .attach .doc { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; flex: none; }
  .attach .doc { display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); font-size: 10px; font-weight: 600; color: var(--accent-ink); }
  .attach .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }
  .attach button { border: 0; background: none; color: var(--muted); font-size: 16px; line-height: 1; padding: 2px 4px; }
  .msg-user .att { display: block; max-width: 220px; max-height: 220px; border-radius: 10px; margin-bottom: 8px; object-fit: cover; }
  .msg-user .att-doc { display: inline-block; margin-bottom: 6px; font-size: 12px; color: var(--muted); }
  .pop button { margin-top: 6px; }

  /* Guide-me explainables */
  .guide [data-explain] { position: relative; }
  .guide [data-explain]::after {
    content: ""; position: absolute; top: -3px; right: -3px; width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 0 2px var(--bg); pointer-events: none;
  }
  .pop { position: fixed; z-index: 60; max-width: 260px; background: var(--text); color: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.45; box-shadow: var(--shadow); }
  .pop b { display: block; font-weight: 600; margin-bottom: 2px; }
  .pop button { margin-top: 8px; background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 4px 10px; font-size: 12px; font-weight: 500; }

  /* Clawd on the canvas */
  .clawd {
    position: absolute; z-index: 30; left: 0; top: 0; width: 64px;
    transition: left 1.1s ease-in-out, top 1.1s ease-in-out, width .8s ease-in-out;
  }
  .clawd[hidden] { display: none !important; }
  .clawd.big { width: 104px; }
  .clawd-body { display: block; width: 100%; background: none; border: 0; padding: 0; }
  .clawd-body svg { width: 100%; height: auto; display: block; overflow: visible; }
  .clawd.facing-left .clawd-body svg { transform: scaleX(-1); }

  /* Clawd poses, redrawn from the clips in animations/ on the same 14x10 pixel grid.
     1 CSS px inside the SVG = 1 Clawd pixel. Props (band, dumbbell, flag, confetti) are hidden until a state shows them. */
  .cw-body, .cw-arm, .cw-arm-up, .cw-leg { fill: #d97757; }
  .cw-eye, .cw-happy { fill: #141413; }
  .cw-band { fill: #2f4a7a; }
  .cw-iron { fill: var(--text); }
  .cw-check-a { fill: var(--text); }
  .cw-check-b { fill: var(--surface); }
  .cw-arm-up, .cw-happy, .cw-band, .cw-bell, .cw-flag, .cw-confetti { display: none; }
  .clawd .sprite, .clawd .cw-eyes, .clawd .cw-leg, .clawd .cw-bell, .clawd .cw-flag-cloth { transform-box: fill-box; }
  .clawd .sprite { transform-origin: 50% 100%; }

  /* Idle (clip 1C8B): rest, blink, crouch, hop, land. */
  .clawd .sprite { animation: cw-idle 5.2s ease-in-out infinite; }
  .clawd .cw-eyes { transform-origin: 50% 50%; animation: cw-blink 4.4s steps(1) infinite; }
  @keyframes cw-idle {
    0%, 76%, 100% { transform: none; }
    80% { transform: scale(1.06, .86); }
    86% { transform: translateY(-2.5px) scale(.97, 1.04); }
    92% { transform: none; }
    95% { transform: scale(1.04, .92); }
  }
  @keyframes cw-blink { 0%, 58%, 62%, 100% { transform: none; } 59% { transform: scaleY(.15); } }

  /* Walking and roaming (clips 294D, BE89): lean, alternating legs, eyes lead. */
  .clawd.walking .sprite { animation: cw-lean .56s ease-in-out infinite; }
  .clawd.walking .cw-leg.a { animation: cw-step .28s steps(1) infinite; }
  .clawd.walking .cw-leg.b { animation: cw-step .28s steps(1) infinite reverse; }
  .clawd.walking .cw-eyes { animation: none; transform: translateX(1px); }
  @keyframes cw-lean { 0%, 100% { transform: rotate(-3deg) translateY(-.5px); } 50% { transform: rotate(3deg); } }
  @keyframes cw-step { 0% { transform: translateY(-1px); } 50% { transform: none; } }

  /* Busy while Claude answers (clip 294D in place): gentle sway, eyes glance around. */
  .clawd.state-busy .sprite { animation: cw-sway 1.6s ease-in-out infinite; }
  .clawd.state-busy .cw-eyes { animation: cw-glance 2.4s steps(1) infinite; }
  @keyframes cw-sway { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
  @keyframes cw-glance { 0%, 100% { transform: translateX(-1px); } 50% { transform: translateX(1px); } }

  /* Lab training (clip 61C1): sweatband on, dumbbell curls overhead. */
  .clawd.state-train .cw-band, .clawd.state-train .cw-bell { display: inline; }
  .clawd.state-train .sprite { animation: cw-lift 1.4s steps(1) infinite; }
  .clawd.state-train .cw-bell { animation: cw-bell 1.4s steps(1) infinite; }
  .clawd.state-train .cw-arm-r { animation: cw-arm-down 1.4s steps(1) infinite; }
  .clawd.state-train .cw-arm-up { display: inline; animation: cw-arm-up 1.4s steps(1) infinite; }
  @keyframes cw-lift { 0% { transform: scale(1.04, .92); } 50% { transform: translateY(-.5px); } }
  @keyframes cw-bell { 0% { transform: translateY(8px); } 50% { transform: none; } } /* down: hangs at the side, up: overhead */
  @keyframes cw-arm-down { 0% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes cw-arm-up { 0% { opacity: 0; } 50% { opacity: 1; } }

  /* Celebrate (clip 7FB0): jump with an arm up, confetti burst. */
  .clawd.state-celebrate .cw-confetti, .clawd.state-celebrate .cw-arm-up { display: inline; }
  .clawd.state-celebrate .cw-arm-r { display: none; }
  .clawd.state-celebrate .sprite { animation: cw-jump .65s ease-out 4; }
  .clawd.state-celebrate .cw-confetti rect { animation: cw-burst 1.3s ease-out 2 both; }
  @keyframes cw-jump {
    0%, 100% { transform: scale(1.06, .86); }
    35% { transform: translateY(-3.5px) scale(.96, 1.05); }
    70% { transform: none; }
  }
  @keyframes cw-burst {
    0% { transform: translate(0, 0); opacity: 1; }
    100% { transform: translate(calc(var(--dx) * 1px), calc(var(--dy) * 1px)); opacity: 0; }
  }

  /* Mission complete (clip 88A6): happy ^ ^ eyes, waving checkered flag. */
  .clawd.state-flag .cw-flag, .clawd.state-flag .cw-arm-up, .clawd.state-flag .cw-happy { display: inline; }
  .clawd.state-flag .cw-arm-r, .clawd.state-flag .cw-eyes { display: none; }
  .clawd.state-flag .sprite { animation: cw-proud 1.2s ease-in-out infinite; }
  .clawd.state-flag .cw-flag-cloth { transform-origin: 100% 50%; animation: cw-wave .5s ease-in-out infinite alternate; }
  @keyframes cw-proud { 0%, 100% { transform: none; } 50% { transform: translateY(-.5px); } }
  @keyframes cw-wave { from { transform: skewY(-10deg); } to { transform: skewY(8deg) scaleX(.9); } }

  /* A single hop when Clawd has something to say (clip 1C8B, one beat). */
  .clawd.state-hop .sprite { animation: cw-jump .6s ease-out 1; }

  .say {
    position: absolute; width: max-content; max-width: min(340px, calc(100vw - 48px));
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
    padding: 12px 14px; font-size: 13px; line-height: 1.5; color: var(--text);
  }
  .say[hidden] { display: none !important; }
  .clawd.big .say { top: calc(100% + 14px); left: 50%; transform: translateX(-50%); max-width: min(400px, calc(100vw - 48px)); width: min(400px, calc(100vw - 48px)); }
  .clawd:not(.big) .say { bottom: calc(100% + 10px); right: 0; }
  .clawd:not(.big).say-start .say { right: auto; left: 0; }
  /* Walk first, then speak: the bubble waits until Clawd arrives, so it never trails off-screen mid-walk. */
  .clawd.walking .say { visibility: hidden; }
  .clawd:not(.big).say-below .say { bottom: auto; top: calc(100% + 10px); }
  /* Pointing at an anchor: the raised arm (flipped with Clawd when it faces left) points at it. */
  .clawd.pointing:not(.walking) .cw-arm-up { display: inline; }
  .clawd.pointing:not(.walking) .cw-arm-r { display: none; }
  .say .lead { font-size: 15px; font-weight: 500; margin: 0 0 4px; }
  .say p { margin: 0; }
  .say .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .say input[type="text"] { width: 100%; margin-top: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: 14px var(--ui); background: var(--bg); color: var(--text); }
  /* Skip / close links always sit on the right, away from the main action. */
  .say .skip { display: block; width: fit-content; margin: 10px 0 0 auto; background: none; border: 0; padding: 0; color: var(--muted); font-size: 12px; text-decoration: underline; }
  .say .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; }
  .say .foot .skip { margin: 0 0 0 auto; }
  .say .ask { margin-top: 10px; font-weight: 500; }
  .say .fine { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .langs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .lang { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 13px; }
  .lang[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 500; }
  .own { display: flex; gap: 6px; margin-top: 8px; }
  .say .own input[type="text"] { margin-top: 0; flex: 1; min-width: 0; }
  .choices { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .choice { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 12px; font-size: 13px; }
  .choice:hover { border-color: var(--accent); }

  let lastTyped = 0;
  prompt.addEventListener("input", () => { lastTyped = Date.now(); });

  const call = (url, body, method = "POST") =>
    fetch(url, { method, headers: { "content-type": "application/json" }, body: body ? JSON.stringify(body) : undefined })
      .then((r) => r.json());

  // The first request also sets the anonymous user cookie, so it finishes before anything else is sent.
  if (location.protocol.startsWith("http")) {
    fetch("/api/profile", { headers: { accept: "application/json" } })
      .then((r) => (r.ok ? r.json() : null))
      .then((d) => {
        api.on = !!d && (!d.backend?.offline || forceBackend);
        if (api.on) { $("clawdBody").dataset.i18nAria = "askClawd"; applyStatic(); refreshProfile(); }
      })
      .catch(() => {});
  }

  // ---------- Attachments: a photo or a PDF for Claude to read (backend only) ----------
  const MAX_BYTES = 5 * 1024 * 1024; // same limit as the backend
  const readB64 = (blob) => new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(",")[1]);
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
  // Phone photos are often over 5 MB (and HEIC on iPhones), so images are redrawn as a JPEG of at most 1600 px.
  async function shrinkImage(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      return await new Promise((res) => c.toBlob(res, "image/jpeg", 0.85));
    } finally { URL.revokeObjectURL(url); }
  }
  async function pickFile(file) {
    if (!file) return;
    const isPdf = file.type === "application/pdf";
    let blob = file;
    if (!isPdf) blob = await shrinkImage(file).catch(() => null);
    if (!blob || blob.size > MAX_BYTES) {
      clawd.hidden = false;
      speakSmall(t(isPdf ? "pdfTooBig" : "badPhoto"), true);
      return;
    }
    const data = await readB64(blob);
    const media_type = isPdf ? "application/pdf" : "image/jpeg";
    S.file = { media_type, data, name: file.name || (isPdf ? "document.pdf" : "photo.jpg"), preview: isPdf ? null : `data:${media_type};base64,${data}` };
    renderAttach();
    prompt.focus();
  }
  function renderAttach() {
    const box = $("attach"), f = S.file;
    box.hidden = !f;
    box.innerHTML = f ? `${f.preview ? `<img src="${f.preview}" alt="">` : `<span class="doc">PDF</span>`}
      <span class="name">${esc(f.name)}</span><button type="button" id="dropFile" aria-label="${esc(t("removeFile"))}">&times;</button>` : "";
  }
  function openPicker() { $("fileInput").value = ""; $("fileInput").click(); }
  $("fileInput").addEventListener("change", (e) => pickFile(e.target.files[0]));
  $("attach").addEventListener("click", (e) => { if (e.target.closest("#dropFile")) { S.file = null; renderAttach(); } });
  $("composer").querySelector('[data-explain="attach"]').addEventListener("click", () => {
    // On touch screens in "Guide me" the first tap shows the explainer; its "Choose a photo or PDF" button opens the picker.
    if (api.on && (level !== "guide" || matchMedia("(hover: hover)").matches)) openPicker();
  });

  // POST /api/turn streams server-sent events: (token | searching)*, answer_done, coach*, done | error.
  async function askBackend(text, el, whoEl, file) {
    el.innerHTML = `<span class="thinking">${t(file ? (file.media_type === "application/pdf" ? "readingPdf" : "readingPhoto") : "thinking")}</span>`;
    const attachment = file ? { media_type: file.media_type, data: file.data } : undefined;
    const situation = S.situation || undefined;
    S.situation = null;
    const res = await fetch("/api/turn", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ message: text, attachment, situation }) });
    if (!res.ok || !res.body) throw new Error("turn failed");
    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    let buf = "", out = "", searching = false;
    // A web search can take a while, so say so below whatever is already written. The next token clears it.
    const paint = () => {
      if (out) renderAnswer(el, out); else el.innerHTML = "";
      if (searching) el.insertAdjacentHTML("beforeend", `<p class="thinking">${t("searchingOnline")}</p>`);
    };
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += value;
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, i);
        buf = buf.slice(i + 2);
        const ev = /^event: (.*)$/m.exec(chunk)?.[1];
        const data = JSON.parse(/^data: (.*)$/m.exec(chunk)?.[1] || "{}");
        if (ev === "token") { out += data.text; searching = false; paint(); scrollDown(); }
        else if (ev === "searching") { searching = true; paint(); scrollDown(); }
        else if (ev === "answer_done" && data.offline) whoEl.insertAdjacentHTML("beforeend", `<span class="tag offline">${t("offlineBackend")}</span>`);
        else if (ev === "coach") showCoach(data);
        else if (ev === "error") throw new Error(data.message);
      }
    }
    return out;
  }

  // A coach event from the backend. The server already decided it should be shown; this only picks the moment.
  function showCoach(e, deferred) {
    if (level === "off") return;
    if (e.action === "award_card" && !deferred) addChip(e.text || t("newCard"));
    if (e.quiet) return;
    if (e.deliver === "at_pause" && Date.now() - lastTyped < 1500) { setTimeout(() => showCoach(e, true), 800); return; }
    api.coachSpoke = true;
    clawd.hidden = false;
    roam(e.point_at);
    if (e.action === "award_card" || e.mood === "celebrate") pose("celebrate", 2600);
    else pose("hop", 700);
    const btns = (e.buttons || []).map((b) =>
      `<button class="btn ${b.id === "accept" ? "primary" : b.id === "never" ? "ghost" : ""}" data-coach="${esc(e.id)}" data-resp="${b.id}">${esc(b.label)}</button>`).join("");
    if (btns) api.pending.set(e.id, e);
    speakSmall(e.text || "", !btns, btns);
  }

  async function ackCoach(id, resp) {
    api.pending.delete(id);
    speak("");
    if (level === "useful") clawd.hidden = true;
    const r = await call("/api/coach/ack", { event_id: id, response: resp }).catch(() => null);
    if (!r?.ok) return;
    if (r.effect?.open_lab) openLab(r.effect.open_lab);
    if (r.effect?.level) setLevel(r.effect.level, true);
    if (r.effect?.saved_fact) addChip(t("memoryUpdated"));
    if (r.effect?.mission) addChip(t("challengeStarted"));
    for (const ev of r.events || []) showCoach(ev);
    refreshProfile();
  }

  // ---------- Progress from the backend: challenges, cards, what Clawd remembers ----------
  function refreshProfile() {
    if (!api.on) return Promise.resolve();
    return fetch("/api/profile").then((r) => r.json())
      .then((d) => { api.profile = d; if (S.view === "home") renderPanel(); syncLang(d); })
      .catch(() => {});
  }

  // A language saved in the profile wins over this screen's. With none saved, the screen tells the server what it
  // shows (a switcher pick as the user's choice, else the system default), so answers and cards follow it.
  function syncLang(d) {
    if (!d || api.langSaving) return;
    const saved = d.profile?.language;
    if (saved) { if (saved !== S.language) setLang(saved, { patch: false }); return; }
    if (chosenLanguage()) setLang(chosenLanguage());
    else if (d.ui_language !== S.language) call("/api/profile", { ui_language: S.language }, "PATCH").then(refreshProfile).catch(() => {});
  }

  function progressHtml() {
    const p = api.on && api.profile;
    if (!p) return "";
    const challenges = p.challenges.map((c) => `<button class="mission ${c.status === "done" ? "done" : ""}" data-challenge="${esc(c.id)}" ${c.status ? "disabled" : ""}>
        <span class="t">${esc(c.title)}</span><span class="d">${esc(c.status === "open" ? t("challengeOpen") : c.status === "done" ? t("challengeDone") : c.prompt)}</span>
        <span class="m">${t(c.status === "done" ? "statusDone" : c.status === "open" ? "statusOpen" : "statusStart")}</span></button>`).join("");
    const cards = p.cards.length
      ? `<div class="cards">${p.cards.map((c) => `<div class="card-chip"><b>${esc(c.title)}</b>${esc(c.lesson || "")}</div>`).join("")}</div>`
      : `<p class="q-help">${t("noCards")}</p>`;
    const pr = p.profile || {};
    const items = [
      pr.name && [t("yourName"), pr.name, null],
      pr.language && [t("language"), tx("langNames")[pr.language] || pr.language, null],
      pr.answer_style && [t("answers"), tx("styles")[pr.answer_style] || pr.answer_style, null],
      ...(pr.facts || []).map((f) => [t("learnedFrom", { from: !f.learned_from || f.learned_from === "chat" ? t("fromChat") : f.learned_from }), f.text, `fact=${f.id}`]),
      ...(p.skills || []).map((sk) => [t("skill"), sk.title, `skill=${sk.id}`]),
    ].filter(Boolean);
    const memory = items.length
      ? `<ul class="mem">${items.map(([k, v, del]) => `<li><span><small>${esc(k)}</small>${esc(v)}</span>${del ? `<button class="x" type="button" data-forget="${esc(del)}" aria-label="${esc(t("forget", { what: v }))}">&times;</button>` : ""}</li>`).join("")}</ul>`
      : `<p class="q-help">${t("nothingYet")}</p>`;
    return `<div><p class="section-label">${t("challengesLabel")}</p><div class="missions">${challenges}</div></div>
      <div class="cards-wrap"><p class="section-label">${t("cardsLabel", { n: p.cards.length, total: p.cards_total })}</p>${cards}</div>
      <div><p class="section-label">${t("remembersLabel")}</p>${memory}<button class="btn" type="button" data-act="copyprofile">${t("copyProfile")}</button></div>`;
  }

  async function startChallenge(id) {
    const r = await call(`/api/challenges/${encodeURIComponent(id)}`).catch(() => null);
    if (!r?.challenges) return;
    api.profile = { ...api.profile, ...r };
    renderPanel();
    const c = r.challenges.find((x) => x.id === id);
    addChip(t("challengeStartedNamed", { title: c.title }));
    clawd.hidden = false; roam(null); pose("hop", 700);
    speakSmall(t("deal", { prompt: c.prompt }), true);
  }

  async function forget(query) {
    const r = await fetch(`/api/profile?${query}`, { method: "DELETE" }).then((x) => x.json()).catch(() => null);
    if (r?.profile) { api.profile = { ...api.profile, ...r }; renderPanel(); }
  }

  async function copyProfile() {
    const text = await fetch("/api/profile/export").then((r) => r.text()).catch(() => "");
    if (!text) return;
    clawd.hidden = false; roam(null);
    try {
      await navigator.clipboard.writeText(text);
      speakSmall(t("copied"), true);
    } catch {
      speak(`<p>${t("copyThis")}</p><textarea class="copy-box" readonly>${esc(text)}</textarea><button class="skip" type="button" data-act="hush">${t("done")}</button>`);
    }
  }

  // Demo button: jump to the user's next visit. Clawd greets them and checks in on an open challenge.
  async function weekLater() {
    if (!api.on || S.ftue !== "done") return;
    speak("");
    addChip(t("weekLaterChip"));
    const r = await call("/api/session/return").catch(() => null);
    if (level === "off") setLevel("useful");
    for (const ev of r?.events || []) showCoach(ev);
    if (!r?.events?.length) { clawd.hidden = false; roam(null); speakSmall(named("welcomeBack"), true); }
    refreshProfile();
  }
  $("weekLater").addEventListener("click", weekLater);

  // Tapping Clawd: ask it anything. POST /api/mascot runs the coach in chat mode and returns its reply.
  function askClawd() {
    pose("hop", 700);
    speak(`<p class="lead">${t("askTitle")}</p><p>${t("askHelp")}</p>
      <form id="askForm"><input type="text" id="askInput" maxlength="300" autocomplete="off" placeholder="${esc(t("askPlaceholder"))}" aria-label="${esc(t("askClawd"))}">
      <div class="actions"><button class="btn primary" type="submit">${t("ask")}</button><button class="btn ghost" type="button" data-act="panel">${t("labAndSettings")}</button></div></form>`);
    setTimeout(() => $("askInput")?.focus(), 50);
  }

  async function sendToClawd(text) {
    text = (text || "").trim();
    if (!text) { $("askInput")?.focus(); return; }
    speak(`<p class="thinking">${t("letMeThink")}</p>`);
    pose("busy");
    const r = await call("/api/mascot", { message: text }).catch(() => null);
    pose(null);
    if (!r?.events?.length) { speakSmall(t("noAnswer"), true); return; }
    // Cards and other moves go through the usual path; the reply itself offers a follow-up question.
    const reply = r.events.find((ev) => ev.action === "show_tip" && !ev.buttons);
    for (const ev of r.events) if (ev !== reply) showCoach(ev);
    if (reply) {
      clawd.hidden = false;
      roam(reply.point_at);
      pose(reply.mood === "celebrate" ? "celebrate" : "hop", reply.mood === "celebrate" ? 2600 : 700);
      speakSmall(reply.text || "", false, `<button class="btn primary" data-act="ask">${t("askMore")}</button><button class="btn ghost" data-act="hush">${t("gotIt")}</button>`);
    }
  }

  function addChip(text) {
    const d = document.createElement("div");
    d.className = "sys";
    d.innerHTML = `<span class="chip"><span class="dot"></span>${esc(text)}</span>`;
    thread.append(d);
    scrollDown();
  }

  // ---------- Clawd placement ----------
  let lastLeft = null;
  function placeClawd(instant) {
    if (instant === true || lastLeft === null) {
      clawd.style.transition = "none";
      requestAnimationFrame(() => requestAnimationFrame(() => { clawd.style.transition = ""; }));
    }
    const c = chat.getBoundingClientRect();
    let left, top, face = 0; // face: -1 look left, 1 look right, 0 default
    const w = S.ftue !== "done" ? 104 : mobile() ? 52 : 64;
    const h = w * (10 / 14);
    const spot = S.ftue === "done" && anchor ? anchorSpot(anchor, c, w, h) : null;
    if (S.ftue !== "done") {
      left = (c.width - w) / 2;
      top = Math.max(76, c.height * 0.12);
    } else if (spot) {
      ({ left, top, face } = spot);
    } else {
      const comp = $("composer").getBoundingClientRect();
      left = comp.right - c.left - w - 24;
      top = comp.top - c.top - h + 4;
    }
    clawd.style.width = S.ftue !== "done" ? "" : w + "px";
    clawd.classList.toggle("pointing", !!spot);
    // The bubble opens away from the nearest edges so it never leaves the screen.
    clawd.classList.toggle("say-start", S.ftue === "done" && left < c.width / 2 - w / 2);
    clawd.classList.toggle("say-below", S.ftue === "done" && top < 190);
    const settle = () => clawd.classList.toggle("facing-left", face < 0);
    if (lastLeft !== null && Math.abs(left - lastLeft) > 4) {
      clawd.classList.toggle("facing-left", left < lastLeft);
      clawd.classList.add("walking");
      clearTimeout(placeClawd.t);
      placeClawd.t = setTimeout(() => { clawd.classList.remove("walking"); settle(); }, 1150);
    } else if (!clawd.classList.contains("walking")) settle();
    lastLeft = left;
    clawd.style.left = left + "px";
    clawd.style.top = top + "px";
  }
  addEventListener("resize", () => placeClawd(true));

  // ---------- Roaming to what Clawd is talking about ----------
  // Anchors match the coach's point_at values (plus a few the prototype's own tips use).
  let anchor = null;
  const shown = (el) => { if (!el) return null; const r = el.getBoundingClientRect(); return r.width && r.height && r.right > 0 && r.left < innerWidth ? el : null; };
  const last = (sel) => [...thread.querySelectorAll(sel)].pop() || null;
  const ANCHORS = {
    upload_button: () => shown($("composer").querySelector('[data-explain="attach"]')),
    composer: () => null, // Clawd's home spot, next to the send button
    answer_notes: () => shown(last(".notes")) || shown(last(".msg-claude")),
    card_shelf: () => shown(body.querySelector(".cards-wrap")) || shown(last(".sys")),
    lab_button: () => shown(body.querySelector("[data-mission]:not(:disabled)")) || shown($("navClawd")),
    explain_dot: () => shown(document.querySelector(".chat-head [data-explain]")),
  };

  // Where to stand for an anchor: beside it, never on top of it, always inside the chat area.
  function anchorSpot(name, c, w, h) {
    const el = ANCHORS[name]?.();
    if (!el) return null;
    const t = el.getBoundingClientRect();
    const clampX = (x) => Math.min(Math.max(8, x), c.width - w - 8);
    const clampY = (y) => Math.min(Math.max(56, y), c.height - h - 8);
    const mid = (t.left + t.right) / 2 - c.left;
    if (t.right <= c.left + 4 || t.left >= c.right - 4) {
      // Outside the chat (sidebar or panel): walk to that edge and point across.
      const toLeft = t.right <= c.left + 4;
      return { left: toLeft ? 12 : c.width - w - 12, top: clampY(t.top - c.top + t.height / 2 - h / 2), face: toLeft ? -1 : 1 };
    }
    if ($("composer").contains(el)) {
      // In the composer: sit on its top edge, right above the button.
      return { left: clampX(mid - w / 2), top: $("composer").getBoundingClientRect().top - c.top - h + 4, face: 0 };
    }
    if (c.right - t.right >= w + 24) {
      // Room in the margin: stand next to it, looking at it.
      return { left: clampX(t.right - c.left + 12), top: clampY(t.top - c.top + Math.min(t.height, 120) / 2 - h / 2), face: -1 };
    }
    // No margin: stand just under its bottom-right corner and point up (above it is usually the user's own
    // message). If something is already there, stand on the composer edge below it instead.
    const home = $("composer").getBoundingClientRect().top - c.top - h + 4;
    const x = clampX(t.right - c.left - w - 8);
    const y = clampY(Math.min(t.bottom - c.top + 4, home));
    const box = { left: c.left + x, right: c.left + x + w, top: c.top + y, bottom: c.top + y + h };
    const taken = [...thread.children].some((el) => {
      const r = el.getBoundingClientRect();
      return el !== el.parentNode.querySelector(":scope > .hello") && r.left < box.right && r.right > box.left && r.top < box.bottom && r.bottom > box.top;
    });
    return { left: x, top: taken ? home : y, face: 0 };
  }

  function roam(name) {
    anchor = name && ANCHORS[name] ? name : null;
    const el = anchor && ANCHORS[anchor]();
    if (el && thread.contains(el)) el.scrollIntoView({ block: "nearest" });
    placeClawd();
  }
  function goHome() { if (anchor) { anchor = null; placeClawd(); } }

  // Only move at a pause: once scrolling stops, follow the anchor or go home if it scrolled away.
  $("thread").addEventListener("scroll", () => {
    if (!anchor) return;
    clearTimeout(roam.t);
    roam.t = setTimeout(() => { if (!ANCHORS[anchor]?.()) anchor = null; placeClawd(); }, 350);
  });

  // ---------- Clawd poses (from animations/) ----------
  // A base pose lasts while its context does (training in the Lab); a timed pose plays once, then Clawd returns to base.
  const POSES = ["busy", "train", "celebrate", "flag", "hop"];
  let basePose = null, poseTimer = null;
  function pose(name, ms) {
    clearTimeout(poseTimer);
    clawd.classList.remove(...POSES.map((p) => "state-" + p));
    const p = name || basePose;
    if (p) { void clawd.offsetWidth; clawd.classList.add("state-" + p); } // reflow restarts the animation
    if (name && ms) poseTimer = setTimeout(() => pose(null), ms);
  }
  function setBasePose(name) { basePose = name; pose(null); }

  function speak(html) {
    if (!html) { say.hidden = true; say.innerHTML = ""; goHome(); return; }
    say.innerHTML = html;
    say.hidden = false;
  }

  // ---------- First-time experience ----------
  function ftueDots(i) { return `<div class="dots">${[0, 1, 2, 3, 4].map((n) => `<span class="${n <= i ? "on" : ""}"></span>`).join("")}</div>`; }

  // "Your guide for Claude": the user's CLAUDE.md in plain words, built from their onboarding answers, in the app language.
  function writeGuide() {
    const g = tx("guideLines"), topics = tx("topics");
    const mine = TOPICS.filter((x) => S.helps.includes(x.id) && topics[x.id][1]).map((x) => topics[x.id][1]);
    const lines = [
      S.name && t("guideIam", { name: S.name }),
      mine.length ? `${g.helpWith}\n${mine.map((x) => "• " + x).join("\n")}` : S.helps.includes("explore") && g.discover,
      S.other && t("guideAlso", { text: S.other }),
      S.style && tx("answerStyles")[S.style][2],
      t("guideAnswerIn", { lang: tx("langNames")[S.language] }),
      ...S.always.map((r) => r === DOUBLE_CHECK ? g.doubleCheck : optLabel("you", "always", r) + "."),
    ];
    return lines.filter(Boolean).join("\n");
  }

  function renderFtue() {
    main.classList.add("ftue-on", "no-panel");
    clawd.classList.add("big");
    clawd.hidden = false;
    placeClawd();
    const skip = `<button class="skip" type="button" data-ftue="skip">${t("skipForNow")}</button>`;
    if (S.ftue === 0) {
      speak(`${ftueDots(0)}<p class="lead">${t("ftueLead")}</p>
        <p>${t("ftueText")}</p>
        <p class="ask">${t("whichLanguage")}</p>
        <div class="langs" role="group" aria-label="${esc(t("langGroup"))}">${Object.entries(LAB_LANG).map(([name, k]) =>
          `<button class="lang" type="button" data-lang="${k}" aria-pressed="${S.language === k}">${name}</button>`).join("")}</div>
        <p class="fine">${t("privacyNote")}</p>
        <div class="foot"><button class="btn primary" type="button" data-ftue="next">${t("continue")}</button>${skip}</div>`);
    } else if (S.ftue === 1) {
      const typed = $("nameInput")?.value ?? S.name; // kept when the language changes on this screen
      speak(`${ftueDots(1)}<p class="lead">${t("callYou")}</p>
        <p>${t("callYouNote")}</p>
        <form id="nameForm"><input type="text" id="nameInput" autocomplete="given-name" placeholder="${esc(t("nickname"))}" aria-label="${esc(t("nickname"))}" value="${esc(typed)}">
        <div class="foot"><button class="btn primary" type="submit">${t("continue")}</button>${skip}</div></form>`);
      setTimeout(() => $("nameInput")?.focus(), 50);
    } else if (S.ftue === 2) {
      const topics = tx("topics");
      speak(`${ftueDots(2)}<p class="lead">${named("niceToMeet", true)}</p>
        <p class="ask">${t("helpWith")}</p><p class="fine">${t("pickMany")}</p>
        <div class="choices">${TOPICS.map((x) => `<button class="choice" type="button" data-topic="${x.id}" aria-pressed="${S.helps.includes(x.id)}"><span class="ic" aria-hidden="true">${x.ic}</span>${esc(topics[x.id][0])}</button>`).join("")}</div>
        <input type="text" id="otherInput" maxlength="200" placeholder="${esc(t("somethingElse"))}" aria-label="${esc(t("somethingElseAria"))}" value="${esc(S.other)}">
        <div class="foot"><button class="btn primary" type="button" data-ftue="topics">${t("continue")}</button>${skip}</div>`);
    } else if (S.ftue === 3) {
      const styles = tx("answerStyles");
      speak(`${ftueDots(3)}<p class="lead">${t("howAnswers")}</p><p>${t("howAnswersNote")}</p>
        <div class="choices">${STYLES.map((x) => `<button class="choice" type="button" data-style="${x.id}">${esc(styles[x.id][0])}<small>${esc(styles[x.id][1])}</small></button>`).join("")}</div>
        <div class="foot">${skip}</div>`);
    } else if (S.ftue === 4) {
      const card = S.editingGuide
        ? `<textarea class="guide-card" id="guideInput" maxlength="1000" aria-label="${esc(t("guideAria"))}">${esc(S.guide)}</textarea>`
        : `<div class="guide-card">${esc(S.guide)}</div>`;
      speak(`${ftueDots(4)}<p class="lead">${t("guideLead")}</p>
        <p>${t("guideText")}</p>
        ${card}
        <p class="fine">${t("guideDev")}</p>
        <div class="foot"><div class="actions" style="margin:0">${S.editingGuide
          ? `<button class="btn primary" type="button" data-ftue="saveguide">${t("save")}</button>`
          : `<button class="btn primary" type="button" data-ftue="done">${t("looksGood")}</button><button class="btn" type="button" data-ftue="edit">${t("edit")}</button>`}</div>${skip}</div>`);
      if (S.editingGuide) setTimeout(() => $("guideInput")?.focus(), 50);
    }
  }

  // Onboarding buttons. Kept apart from act(): the Lab has its own "next".
  function ftueAct(a) {
    if (a === "skip") { S.intent = "task"; S.guide = ""; finishFtue("useful"); return; }
    if (a === "next") { S.ftue = 1; renderFtue(); return; }
    if (a === "topics") {
      S.other = ($("otherInput")?.value || "").trim().slice(0, 200);
      if (!S.helps.length && !S.other) { $("otherInput")?.focus(); return; }
      if (S.helps.some((x) => CHECK_TOPICS.includes(x)) && !S.always.includes(DOUBLE_CHECK)) S.always.push(DOUBLE_CHECK);
      S.ftue = 3; renderFtue(); return;
    }
    if (a === "edit") { S.editingGuide = true; renderFtue(); return; }
    if (a === "saveguide") { S.guide = ($("guideInput")?.value || "").trim().slice(0, 1000) || writeGuide(); S.editingGuide = false; S.guideEdited = true; renderFtue(); return; }
    // The help level is not asked: people can't judge it before they've seen Clawd.
    // Exploring starts on "Guide me"; everyone else on "Only when useful".
    if (a === "done") {
      S.intent = S.helps.includes("explore") ? "learn" : "task";
      if (S.other) S.firstTask = { typed: S.other };
      finishFtue(S.intent === "learn" ? "guide" : "useful");
    }
  }

  function finishFtue(chosenLevel) {
    S.ftue = "done";
    main.classList.remove("ftue-on");
    clawd.classList.remove("big");
    speak("");
    $("avatar").textContent = S.name ? S.name[0].toUpperCase() : "?";
    $("meName").textContent = S.name || t("guest");
    const guide = S.guide ? { helps_with: S.helps, answer_style: S.style, always: S.always, guide: S.guide } : {};
    if (api.on) call("/api/profile", { name: S.name || null, language: S.language, mode: S.intent === "task" ? "do" : S.intent === "learn" ? "learn" : null, level: chosenLevel, ...guide }, "PATCH").then(refreshProfile).catch(() => {});
    $("weekLater").hidden = !api.on;
    renderHello();
    setLevel(chosenLevel);
    if (chosenLevel !== "off") pose("flag", 2400); // flag wave, then the walk to the message box
    if (S.firstTask?.typed) prompt.value = S.firstTask.typed;
    setTimeout(() => {
      if (level === "off") return;
      if (level === "useful") {
        clawd.hidden = false; placeClawd();
        speakSmall((S.guide ? t("guideSaved") : "") + t("quietUseful"), true);
        return;
      }
      if (S.intent === "learn") {
        showPanel(true);
        roam("lab_button");
        speakSmall(t("labIntro"));
      } else if (level === "guide") {
        roam("explain_dot");
        speakSmall(t("tapDots"), true);
      }
    }, 1200);
  }

  say.addEventListener("submit", (e) => {
    if (e.target.id === "askForm") { e.preventDefault(); sendToClawd($("askInput").value); return; }
    if (e.target.id !== "nameForm") return;
    e.preventDefault();
    S.name = ($("nameInput").value || "").trim().slice(0, 40);
    S.ftue = 2; renderFtue();
  });

  // ---------- Hello and chat ----------
  // The situations that match what they picked in onboarding come first (sort is stable, so the rest keep their order).
  function situationsFirst() {
    const mine = new Set(TOPICS.filter((t) => S.helps.includes(t.id)).flatMap((t) => t.situations));
    return [...SITUATIONS].sort((a, b) => mine.has(b.id) - mine.has(a.id));
  }

  function renderHello() {
    const h = new Date().getHours();
    const part = t(h < 12 ? "morning" : h < 20 ? "afternoon" : "evening");
    const sits = tx("situations");
    thread.innerHTML = `<div class="hello" id="hello"><h1>${S.name ? t("greetName", { part, name: esc(S.name) }) : part}</h1>
      <p class="ask">${t("helpToday")}</p>
      <div class="situations">${situationsFirst().map((x) =>
        `<button type="button" class="situation" data-situation="${x.id}"><span class="ic" aria-hidden="true">${x.ic}</span><span class="t">${esc(sits[x.id][0])}</span><span class="d">${esc(sits[x.id][1])}</span></button>`).join("")}
      </div>
      <div class="suggest"><button type="button" data-suggest="translate">${t("suggestTranslate")}</button></div></div>`;
  }

  // Picking a situation fills in a first message; the ones about a document open the camera / photo picker straight away.
  function pickSituation(id) {
    const x = SITUATIONS.find((s) => s.id === id);
    if (!x) return;
    S.situation = x.id;
    setTitle(() => tx("situations")[x.id][0], S.inRecents);
    prompt.value = tx("situations")[x.id][2];
    lastTyped = Date.now();
    if (x.file && api.on) {
      openPicker();
      if (level !== "off") { clawd.hidden = false; roam("upload_button"); speakSmall(t("takePhoto"), true); }
    } else {
      prompt.focus();
      prompt.setSelectionRange(prompt.value.length, prompt.value.length);
      if (level === "guide") { clawd.hidden = false; roam("composer"); speakSmall(t("addDetails"), true); }
    }
  }

  thread.addEventListener("click", (e) => {
    const sit = e.target.closest("[data-situation]");
    if (sit) { pickSituation(sit.dataset.situation); return; }
    const s = e.target.closest("[data-suggest]");
    if (!s) return;
    S.situation = null;
    prompt.value = request();
    prompt.focus();
  });

  function afterPrompt(text) {
    const a = S.answers.clients;
    const rules = a.rules.length ? a.rules.map((r) => "- " + r).join("\n") : "- (none given)";
    return `You are helping ${S.name || "the user"}, who writes to clients at work. They saved these standing preferences:
- Role: ${a.role || "Office admin"}
- Tone for client emails: ${a.tone || "Warm and formal (vostè)"}
Rules they set:
${rules}

Their request:
${text}

Reply with only the finished email in Catalan, ready to paste, with no preamble and no closing offer. Then a line containing only "---", then a short section starting with the line "${t("notes")}", written in ${I18N.en.langNames[S.language]}, with at most 3 bullets: anything in the original a client could misread, and a confirmation that numbers and dates are unchanged.`;
  }

  // Light Markdown for real answers (bold, italics, headings, bullets). Escapes first, so it stays safe.
  const md = (t) => esc(t)
    .replace(/^#{1,4} +(.+)$/gm, "<strong>$1</strong>")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, "$1<em>$2</em>")
    .replace(/^[-*] +/gm, "• ");

  function renderAnswer(el, text) {
    const i = text.indexOf("\n---");
    const m = i >= 0 ? text.slice(0, i).trim() : text;
    const notes = i >= 0 ? text.slice(i + 4).trim().replace(/^\**(Notes for you|Notas para ti|Notes per a tu)\**:?\s*/i, "") : "";
    el.innerHTML = md(m) + (notes ? `<div class="notes"><b>${t("notes")}</b>${md(notes)}</div>` : "");
  }

  function typeOut(el, text, done) {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) { renderAnswer(el, text); done(); return; }
    let n = 0;
    const t = setInterval(() => {
      n = Math.min(text.length, n + 18);
      renderAnswer(el, text.slice(0, n));
      scrollDown();
      if (n >= text.length) { clearInterval(t); done(); }
    }, 30);
  }

  async function ask(input, fallback, el, whoEl) {
    const offline = () => {
      whoEl.insertAdjacentHTML("beforeend", `<span class="tag offline">${t("offlineExample")}</span>`);
      return new Promise((res) => typeOut(el, fallback, () => res(fallback)));
    };
    if (!sample) return offline();
    el.innerHTML = `<span class="thinking">${t("thinking")}</span>`;
    try {
      const { text } = await sample(input, { modelTier: "quick", onText: ({ text }) => { renderAnswer(el, text); scrollDown(); } });
      return text;
    } catch (e) { return offline(); }
  }

  function scrollDown() { const t = $("thread"); t.scrollTop = t.scrollHeight; }

  function addUser(text, file) {
    $("hello")?.remove();
    const d = document.createElement("div");
    d.className = "msg-user";
    if (file) d.innerHTML = file.preview ? `<img class="att" src="${file.preview}" alt="${esc(t("yourPhoto"))}">` : `<span class="att-doc">📄 ${esc(file.name)}</span><br>`;
    d.append(text);
    thread.append(d);
  }

  function addClaude(kind) {
    const w = document.createElement("div");
    w.className = "msg-claude";
    w.innerHTML = `<div class="who">Claude <span class="tag ${kind}">${t(kind === "after" ? "afterLab" : "before")}</span></div><div class="ans"></div>`;
    thread.append(w);
    scrollDown();
    return [w.querySelector(".ans"), w.querySelector(".who")];
  }

  $("composer").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const text = prompt.value.trim();
    const file = api.on ? S.file : null;
    if ((!text && !file) || busy || S.ftue !== "done") return;
    busy = true; $("send").disabled = true;
    speak("");
    pose("busy");
    const isAfter = S.phase === "saved";
    if (S.phase === "start") setTitle(() => t("titleTranslate"), true);
    if (api.on && S.phase === "start" && !/^(translate|tradu)/i.test(text)) {
      const picked = S.situation;
      const typed = text.split("\n")[0].slice(0, 40);
      setTitle(picked ? () => tx("situations")[picked][0] : text ? () => typed : () => t(file.media_type === "application/pdf" ? "titlePdf" : "titlePhoto"), true);
    }
    addUser(text, file);
    prompt.value = "";
    S.file = null; renderAttach();
    const [el, whoEl] = addClaude(isAfter ? "after" : "before");
    let out;
    api.coachSpoke = false;
    if (api.on) {
      // The backend adds the saved Lab skill to Claude's instructions itself, so the plain request is enough.
      if (api.labSave) await api.labSave.catch(() => {});
      try { out = await askBackend(text, el, whoEl, file); }
      catch (e) { out = await ask(isAfter ? afterPrompt(text) : text, isAfter ? offlineAfter() : OFFLINE_BEFORE, el, whoEl); }
    } else {
      out = await ask(isAfter ? afterPrompt(text) : text, isAfter ? offlineAfter() : OFFLINE_BEFORE, el, whoEl);
    }
    busy = false; $("send").disabled = false;
    pose(null);
    if (api.on) refreshProfile(); // cards can be awarded during a turn
    if (isAfter) {
      S.after = out; S.phase = "after";
      if (level !== "off") pose("celebrate", 2600);
      const b = document.createElement("button");
      b.type = "button"; b.className = "compare-btn"; b.textContent = t("compare");
      b.addEventListener("click", () => { b.remove(); showCompare(); });
      thread.append(b);
      S.view = "home"; renderPanel();
      if (level !== "off") { roam("answer_notes"); speakSmall(t("sameEmail"), true); }
    } else {
      S.before = out; S.phase = "before";
      // With the backend the coach decides; the scripted nudge is only the demo's safety net if it stayed silent.
      // It is about translating client emails, so it only fires for a translation request.
      if (!api.on || (!api.coachSpoke && !file && /translat|tradu/i.test(text))) setTimeout(() => { if (!api.coachSpoke) nudge(); }, 900);
    }
    scrollDown();
  });

  function showCompare() {
    const strip = (t) => { const i = t.indexOf("\n---"); return i >= 0 ? t.slice(0, i).trim() : t; };
    const d = document.createElement("div");
    d.className = "compare";
    d.innerHTML = `<div class="b"><h3>${t("before")}</h3>${md(S.before)}</div><div class="a"><h3>${t("afterLab")}</h3>${md(strip(S.after))}</div>`;
    thread.append(d);
    scrollDown();
  }

  // ---------- Clawd speaking on the canvas ----------
  function speakSmall(text, closable, actions = "") {
    speak(`<p>${esc(text)}</p>${actions ? `<div class="actions">${actions}</div>` : ""}${closable ? `<button class="skip" type="button" data-act="hush">${t("gotIt")}</button>` : ""}`);
  }

  function nudge() {
    if (level === "off" || S.noSuggest || S.phase !== "before") return;
    clawd.hidden = false;
    roam("lab_button");
    pose("hop", 700);
    speakSmall(t("nudge"), false,
      `<button class="btn primary" data-act="lab">${t("teachMe")}</button><button class="btn" data-act="later">${t("notNow")}</button><button class="btn ghost" data-act="never">${t("dontSuggest")}</button>`);
  }

  function setLevel(v, fromServer) {
    if (api.on && !fromServer && v !== level) call("/api/profile", { level: v }, "PATCH").catch(() => {});
    level = v;
    $("lv-" + v).checked = true;
    main.classList.toggle("guide", v === "guide");
    showPanel(panelOpen);
    $("clawdBack").hidden = v !== "off";
    if (v === "off") { hidePop(); speak(""); }
    // "Only when useful": Clawd is off-canvas until a moment worth interrupting for.
    clawd.hidden = v === "off" || (v === "useful" && S.phase !== "before" && S.view !== "lab" && S.view !== "done");
    placeClawd();
    renderPanel();
  }

  // ---------- Side panel ----------
  function renderPanel() {
    $("levelNote").textContent = tx("levels")[level][1];
    if (level === "off") { body.innerHTML = ""; return; }
    if (S.view === "lab") return renderLab();
    if (S.view === "done") return renderDone();
    const isDone = (id) => S.labsDone.includes(id) || (id === "clients" && (S.phase === "saved" || S.phase === "after")) ||
      !!api.profile?.labs?.find((l) => l.id === id)?.done;
    const texts = tx("missions");
    const guide = api.profile?.profile?.guide || S.guide;
    body.innerHTML = (level === "guide" ? `<p class="tip">${t("panelTip")}</p>` : "") +
      (guide ? `<div><p class="section-label">${t("guideAria")}</p><div class="guide-card">${esc(guide)}</div>
        <p class="q-help">${t("guidePanelNote")}</p>
        <button class="btn" type="button" data-mission="you">${t("changeIt")}</button></div>` : "") +
      `<div><p class="section-label">${t("labMissions")}</p><div class="missions">` + MISSIONS.map((m) => {
        const done = isDone(m.id);
        return `<button class="mission ${done ? "done" : ""}" data-mission="${m.id}" ${m.ready && !done ? "" : "disabled"}>
          <span class="t">${texts[m.id][0]}</span><span class="d">${texts[m.id][1]}</span><span class="m">${t(done ? "statusDone" : m.ready ? "statusStart" : "statusSoon")}</span></button>`;
      }).join("") + `</div></div>` + progressHtml();
  }

  function renderLab() {
    const lab = LABS[S.lab], steps = lab.steps, st = steps[S.step];
    const text = tx("labs")[S.lab], stText = text.steps[st.key];
    const val = S.answers[S.lab][st.key];
    const picked = (o) => st.multi ? val.includes(o) : val === o;
    const canNext = st.multi ? val.length > 0 : !!val;
    body.innerHTML = `
      <div class="lab-head">
        <span class="k">${t("labKicker")}</span>
        <h3>${esc(text.title)}</h3>
        <p>${t("labNote")}</p>
        <div class="progress">${steps.map((_, i) => `<span class="${i <= S.step ? "on" : ""}"></span>`).join("")}</div>
      </div>
      <div>
        <p class="q">${esc(stText.q)}</p>
        <p class="q-help">${esc(stText.help)}</p>
        <div class="options">${st.options.map((o) =>
          `<button type="button" class="opt ${st.multi ? "multi" : ""}" data-opt="${esc(o)}" aria-pressed="${picked(o)}"><span class="box"></span>${esc(optLabel(S.lab, st.key, o))}</button>`).join("")}</div>
      </div>
      <div class="lab-nav">
        <button class="btn ghost" data-act="${S.step === 0 ? "quit" : "back"}">${t(S.step === 0 ? "leaveLab" : "back")}</button>
        <button class="btn primary" data-act="next" ${canNext ? "" : "disabled"}>${t(S.step === steps.length - 1 ? "save" : "next")}</button>
      </div>`;
  }

  function renderDone() {
    if (S.lab === "you") {
      body.innerHTML = `
      <div class="win">
        <h3>${t("guideReady")}</h3>
        <div class="saved">
          <strong>${t("guideReads")}</strong>
          <div class="guide-card">${esc(S.guide)}</div>
          <div class="row"><span class="chip" data-explain="memory"><span class="dot"></span>${t("memoryUpdated")}</span></div>
        </div>
      </div>
      <button class="btn primary" data-act="backtochat">${t("backToChat")}</button>`;
      return;
    }
    const a = S.answers.clients;
    body.innerHTML = `
      <div class="win">
        <h3>${t("missionComplete")}</h3>
        <div class="saved">
          <strong>${t("fromNowOn")}</strong>
          <ul>
            <li>${esc(optSaid("clients", "role", a.role))}</li>
            <li>${esc(optSaid("clients", "tone", a.tone))}</li>
            ${a.rules.map((r) => `<li>${esc(optSaid("clients", "rules", r))}</li>`).join("")}
          </ul>
          <div class="row">
            <span class="chip" data-explain="memory"><span class="dot"></span>${t("memoryUpdated")}</span>
            <span class="chip" data-explain="skill"><span class="dot"></span>${t("skillSavedClients")}</span>
          </div>
        </div>
      </div>
      <button class="btn primary" data-act="try">${t("tryIt")}</button>`;
  }

  // The Clawd panel is closed by default: a new user starts in a new chat, not in the Lab.
  // It opens from Clawd in the side nav, from tapping Clawd, or when Clawd sends her to the Lab.
  let panelOpen = false;
  function showPanel(open) {
    panelOpen = !!open && level !== "off" && S.ftue === "done";
    main.classList.toggle("no-panel", !panelOpen);
    panel.classList.toggle("open", panelOpen);
    $("navClawd").classList.toggle("active", panelOpen);
    $("navNew").classList.toggle("active", !panelOpen);
    requestAnimationFrame(() => placeClawd(true));
  }

  function openLab(id = "clients") {
    S.view = "lab"; S.step = 0; S.lab = LABS[id] ? id : "clients";
    // The guide mission starts from what they already told me in onboarding.
    if (S.lab === "you") {
      const a = S.answers.you;
      if (!a.helps.length) a.helps = TOPICS.filter((x) => S.helps.includes(x.id) && x.lab).map((x) => x.lab);
      if (!a.style) a.style = STYLES.find((x) => x.id === S.style)?.lab ?? null;
      if (!a.always.length) a.always = [...S.always];
      if (!a.language) a.language = Object.keys(LAB_LANG).find((name) => LAB_LANG[name] === S.language);
    }
    setBasePose("train");
    clawd.hidden = false; placeClawd();
    speakSmall(t("inLab"), true);
    renderPanel();
    showPanel(true);
  }

  function addSaved() {
    const d = document.createElement("div");
    d.className = "sys";
    d.innerHTML = `<span class="chip" data-explain="memory"><span class="dot"></span>${t("memoryUpdated")}</span><span class="chip" data-explain="skill"><span class="dot"></span>${t("skillSaved")}</span>`;
    thread.append(d);
    scrollDown();
  }

  // ---------- Actions (canvas bubble and panel share them) ----------
  function act(a) {
    if (a === "hush") {
      speak("");
      // "Only when useful": Clawd leaves again once his one line has been read.
      if (level === "useful" && S.phase === "start" && S.view === "home") clawd.hidden = true;
      return;
    }
    if (a === "ask") { askClawd(); return; }
    if (a === "copyprofile") { copyProfile(); return; }
    if (a === "panel") {
      speak(""); showPanel(true); roam("lab_button");
      return;
    }
    if (a === "lab") { openLab(); return; }
    if (a === "later" || a === "never") {
      S.dismissals++;
      if (a === "never") S.noSuggest = true;
      if (S.dismissals >= 2 && level === "guide") {
        speakSmall(t("stepDown"), false,
          `<button class="btn primary" data-act="stepdown">${tx("levels").useful[0]}</button><button class="btn ghost" data-act="keep">${t("keepGuiding")}</button>`);
      } else {
        speak("");
        if (level === "useful") { clawd.hidden = true; }
      }
      return;
    }
    if (a === "stepdown") { S.dismissals = 0; speak(""); setLevel("useful"); return; }
    if (a === "keep") { S.dismissals = 0; speak(""); return; }
    if (a === "quit") { S.view = "home"; speak(""); setBasePose(null); renderPanel(); if (level === "useful") clawd.hidden = true; return; }
    if (a === "back") { S.step--; renderLab(); return; }
    if (a === "backtochat") { showPanel(false); act("quit"); prompt.focus(); return; }
    if (a === "next") {
      if (S.step < LABS[S.lab].steps.length - 1) { S.step++; renderLab(); }
      else if (S.lab !== "clients") {
        const id = S.lab, a = S.answers.you;
        if (!S.labsDone.includes(id)) S.labsDone.push(id);
        // Rewrite their guide from the mission's answers, the same way onboarding did.
        // The language they picked becomes the app's too. The Lab save below stores it in the profile.
        S.helps = TOPICS.filter((x) => a.helps.includes(x.lab)).map((x) => x.id);
        S.style = STYLES.find((x) => x.lab === a.style)?.id ?? S.style;
        S.always = [...a.always];
        const picked = LAB_LANG[a.language];
        S.view = "done";
        if (picked !== S.language) setLang(picked, { patch: false });
        S.guide = writeGuide();
        renderPanel();
        setBasePose(null); pose("celebrate", 2600);
        speakSmall(t("savedGuide"), true);
        if (api.on) {
          api.labSave = call(`/api/lab/${id}`, { answers: a })
            .then((r) => { for (const ev of r.events || []) if (ev.action === "award_card") addChip(ev.text); })
            .then(() => call("/api/profile", { guide: S.guide }, "PATCH"))
            .then(refreshProfile);
        }
      } else {
        S.phase = "saved"; S.view = "done"; renderPanel(); addSaved();
        setBasePose(null); pose("celebrate", 2600);
        speakSmall(t("savedClients"), true);
        if (api.on) {
          // Saves the skill on the server; the next turn waits for this before sending.
          api.labSave = call("/api/lab/clients", { answers: S.answers.clients })
            .then((r) => { for (const ev of r.events || []) if (ev.action === "award_card") addChip(ev.text); refreshProfile(); });
        }
      }
      return;
    }
    if (a === "try") {
      showPanel(false);
      S.view = "home"; renderPanel();
      prompt.value = request();
      $("composer").requestSubmit();
    }
  }

  say.addEventListener("click", (e) => {
    const f = e.target.closest("[data-ftue]"); if (f) { ftueAct(f.dataset.ftue); return; }
    const g = e.target.closest("[data-lang]");
    if (g) { setLang(g.dataset.lang); return; }
    const tp = e.target.closest("[data-topic]");
    if (tp) {
      const id = tp.dataset.topic;
      S.helps = S.helps.includes(id) ? S.helps.filter((x) => x !== id) : [...S.helps, id];
      tp.setAttribute("aria-pressed", String(S.helps.includes(id)));
      return;
    }
    const st = e.target.closest("[data-style]");
    if (st) { S.style = st.dataset.style; S.guide = writeGuide(); S.ftue = 4; renderFtue(); return; }
    const c = e.target.closest("[data-coach]"); if (c) { ackCoach(c.dataset.coach, c.dataset.resp); return; }
    const a = e.target.closest("[data-act]"); if (a) act(a.dataset.act);
  });

  body.addEventListener("click", (e) => {
    const opt = e.target.closest("[data-opt]");
    if (opt) {
      const st = LABS[S.lab].steps[S.step], o = opt.dataset.opt, ans = S.answers[S.lab];
      if (st.multi) {
        const arr = ans[st.key];
        ans[st.key] = arr.includes(o) ? arr.filter((x) => x !== o) : [...arr, o];
      } else ans[st.key] = o;
      renderLab();
      return;
    }
    const ch = e.target.closest("[data-challenge]");
    if (ch && !ch.disabled) { startChallenge(ch.dataset.challenge); return; }
    const fg = e.target.closest("[data-forget]");
    if (fg) { forget(fg.dataset.forget); return; }
    const m = e.target.closest("[data-mission]");
    if (m && !m.disabled) { openLab(m.dataset.mission); return; }
    const a = e.target.closest("[data-act]");
    if (a) act(a.dataset.act);
  });

  $("clawdBody").addEventListener("click", () => {
    if (S.ftue !== "done") return;
    if (api.on && !say.hidden) { speak(""); return; }
    if (api.on) { askClawd(); return; }
    if (!say.hidden && !mobile()) { speak(""); return; }
    showPanel(!panelOpen);
  });

  // ---------- Explain popovers ----------
  let popFor = null;
  function showPop(el) {
    const [title, text] = tx("explain")[el.dataset.explain] || [];
    if (!title) return;
    popFor = el;
    const pick = el.dataset.explain === "attach" && api.on;
    pop.innerHTML = `<b>${esc(title)}</b>${esc(text)}${pick ? `<br><button type="button" data-pick>${t("pickFile")}</button>`
      : S.phase === "start" || S.phase === "before" ? `<br><button type="button" data-lab>${t("tryInLab")}</button>` : ""}`;
    pop.hidden = false;
    const r = el.getBoundingClientRect(), p = pop.getBoundingClientRect();
    const left = Math.min(Math.max(8, r.left), innerWidth - p.width - 8);
    let top = r.bottom + 8;
    if (top + p.height > innerHeight - 8) top = r.top - p.height - 8;
    pop.style.left = left + "px"; pop.style.top = top + "px";
  }
  function hidePop() { pop.hidden = true; popFor = null; }

  document.addEventListener("click", (e) => {
    if (e.target.closest("[data-lab]")) { hidePop(); openLab(); return; }
    if (e.target.closest("[data-pick]")) { hidePop(); openPicker(); return; }
    if (e.target.closest("#pop")) return;
    const el = e.target.closest("[data-explain]");
    if (el && level === "guide" && S.ftue === "done") { e.preventDefault(); popFor === el ? hidePop() : showPop(el); return; }
    hidePop();
  });
  document.addEventListener("mouseover", (e) => {
    if (level !== "guide" || S.ftue !== "done" || !matchMedia("(hover: hover)").matches) return;
    const el = e.target.closest("[data-explain]");
    if (el && el !== popFor) showPop(el);
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") hidePop(); });
  $("thread").addEventListener("scroll", hidePop);

  // ---------- Wiring ----------
  document.querySelectorAll('input[name="level"]').forEach((r) => r.addEventListener("change", () => setLevel(r.value)));
  $("clawdBack").addEventListener("click", () => setLevel("useful"));
  // The nav entry is the always-there way back to Clawd, even when it is set to Off.
  $("navClawd").addEventListener("click", () => {
    if (S.ftue !== "done") return;
    if (panelOpen) { showPanel(false); return; }
    if (level === "off") setLevel("useful");
    showPanel(true);
  });
  $("navNew").addEventListener("click", () => showPanel(false));
  $("closeSheet").addEventListener("click", () => showPanel(false));
  $("menuBtn").addEventListener("click", () => $("sidebar").classList.add("open"));
  $("closeNav").addEventListener("click", () => $("sidebar").classList.remove("open"));
  $("sidebar").addEventListener("click", (e) => { if (e.target.closest("#navClawd")) $("sidebar").classList.remove("open"); });
  $("reset").addEventListener("click", () => {
    rememberLanguage(null); // a new user starts from the system language again
    if (api.on) call("/api/dev/reset").catch(() => {}).finally(start);
    else start();
  });
  $("langSwitch").addEventListener("click", (e) => { const b = e.target.closest("[data-lang]"); if (b) setLang(b.dataset.lang); });

  // ---------- Switching language ----------
  // Fixed words in the page: data-i18n (text), data-i18n-html (our own markup), data-i18n-aria, data-i18n-ph.
  function applyStatic() {
    document.documentElement.lang = S.language;
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-html]").forEach((el) => { el.innerHTML = t(el.dataset.i18nHtml); });
    document.querySelectorAll("[data-i18n-aria]").forEach((el) => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
    document.querySelectorAll("[data-i18n-ph]").forEach((el) => el.setAttribute("placeholder", t(el.dataset.i18nPh)));
    $("langSwitch").querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === S.language)));
    ["guide", "useful", "off"].forEach((k) => { document.querySelector(`label[for="lv-${k}"]`).textContent = tx("levels")[k][0]; });
    $("meName").textContent = S.ftue === "done" && S.name ? S.name : t("guest");
    renderTitle();
  }

  // The chat title (and its Recents entry) is kept as a function, so it can be redrawn in another language.
  function setTitle(fn, inRecents) { S.title = fn; S.inRecents = inRecents; renderTitle(); }
  function renderTitle() {
    const title = S.title ? S.title() : t("newChat");
    $("chatTitle").textContent = title;
    $("recents").innerHTML = S.inRecents ? `<button class="side-btn recent" type="button">${esc(title)}</button>`
      : `<p class="side-empty">${t("recentsEmpty")}</p>`;
  }

  // The user's own pick (switcher or Lab): remembered in this browser and, with the backend, saved in their profile,
  // so Claude and Clawd use it too. Messages already in the chat stay as they are.
  function setLang(v, { patch = true } = {}) {
    if (!I18N[v]) return;
    rememberLanguage(v);
    if (api.on && patch) {
      api.langSaving++;
      call("/api/profile", { language: v }, "PATCH").catch(() => {}).finally(() => { api.langSaving--; refreshProfile(); });
    }
    if (v === S.language) return;
    S.language = v;
    hidePop();
    applyStatic();
    if (S.ftue === 4 && !S.guideEdited) S.guide = writeGuide(); // their guide follows the language until they edit it
    if (S.ftue !== "done") renderFtue();
    else if ($("hello")) renderHello();
    renderPanel();
  }

  function start() {
    S = fresh();
    applyStatic();
    api.pending.clear(); api.labSave = null; api.coachSpoke = false; api.profile = null;
    $("weekLater").hidden = true;
    setBasePose(null);
    level = "guide";
    $("lv-guide").checked = true;
    main.classList.add("guide");
    $("clawdBack").hidden = true;
    showPanel(false);
    hidePop();
    thread.innerHTML = "";
    prompt.value = "";
    renderAttach();
    $("avatar").textContent = "?";
    lastLeft = null; anchor = null;
    speak(""); // no half-typed name left over from the last intro
    renderPanel();
    renderFtue();
  }

  start();
})();
</script>
