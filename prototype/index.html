<title>Clawd Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #faf9f5;
    --surface: #ffffff;
    --sunk: #f0eee6;
    --line: #e8e6dc;
    --muted: #6b6a64;
    --text: #141413;
    --accent: #d97757;
    --accent-ink: #b0502c;
    --accent-soft: #f6e4dc;
    --green: #788c5d;
    --green-ink: #56683f;
    --green-soft: #e7ecdf;
    --side: #f7f6f2;
    --side-ink: #3d3d3a;
    --shadow: 0 1px 2px rgba(20, 20, 19, .06), 0 8px 24px rgba(20, 20, 19, .08);
    --ui: "Poppins", "Helvetica Neue", Arial, sans-serif;
    --read: "Lora", Georgia, "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #1c1b19; --surface: #262522; --sunk: #211f1d; --line: #3a3935;
      --muted: #a3a19a; --text: #f0eee6; --accent-ink: #e8906f; --accent-soft: #3d2a22;
      --green-ink: #a3b788; --green-soft: #2a3122; --side: #201f1d; --side-ink: #d6d4cc;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1c1b19; --surface: #262522; --sunk: #211f1d; --line: #3a3935;
    --muted: #a3a19a; --text: #f0eee6; --accent-ink: #e8906f; --accent-soft: #3d2a22;
    --green-ink: #a3b788; --green-soft: #2a3122; --side: #201f1d; --side-ink: #d6d4cc;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: var(--ui); font-size: 14px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: default; opacity: .5; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { height: 100%; display: grid; grid-template-rows: auto 1fr; }

  .banner {
    display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between;
    padding: 8px 16px; background: var(--text); color: var(--bg); font-size: 12px;
  }
  .banner strong { font-weight: 600; letter-spacing: .02em; }
  .banner button { background: none; border: 1px solid currentColor; border-radius: 6px; padding: 3px 10px; font-size: 12px; color: var(--bg); }

  .main { display: grid; grid-template-columns: 272px minmax(0, 1fr) 320px; min-height: 0; }
  .main.no-panel { grid-template-columns: 272px minmax(0, 1fr) 0; }

  /* Sidebar, modelled on the Claude desktop app */
  .sidebar { border-right: 1px solid var(--line); background: var(--side); display: flex; flex-direction: column; gap: 2px; padding: 14px 10px 16px; min-height: 0; overflow-y: auto; }
  .ico { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .side-top { display: flex; align-items: center; gap: 4px; padding: 0 2px 14px; }
  .side-top .hist { display: flex; gap: 2px; }
  .top-btn { background: none; border: 0; border-radius: 8px; padding: 5px; color: var(--muted); display: grid; place-items: center; }
  .top-btn:hover { background: var(--line); color: var(--text); }
  .top-btn.dim { opacity: .45; }
  .mode { margin-left: auto; display: flex; background: var(--line); border-radius: 12px; padding: 3px; gap: 2px; }
  .mode-btn { background: none; border: 0; border-radius: 9px; padding: 5px 12px; color: var(--muted); display: grid; place-items: center; }
  .mode-btn.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(20,20,19,.12); }
  .close-nav { display: none; margin-left: auto; background: none; border: 0; font-size: 22px; line-height: 1; padding: 4px; }
  .chat-head .menu-btn { display: none; flex: none; }
  .side-btn { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: none; border: 0; border-radius: 10px; padding: 8px 10px; font-size: 15px; color: var(--side-ink); }
  .side-btn:hover { background: var(--line); }
  .side-btn .ico { color: var(--side-ink); }
  .side-btn.new { background: var(--line); color: var(--text); font-weight: 500; margin-bottom: 2px; }
  .side-btn.new .ico { color: var(--text); }
  .side-btn.more, .side-btn.more .ico { color: var(--muted); }
  .mini-clawd { width: 20px; flex: none; display: grid; place-items: center; }
  .mini-clawd img { width: 22px; height: auto; display: block; image-rendering: pixelated; }
  .clawd-nav { color: var(--text); }
  .nav-badge { margin-left: auto; font-size: 10px; font-weight: 600; letter-spacing: .04em; color: var(--accent-ink); background: var(--accent-soft); border-radius: 999px; padding: 1px 7px; }
  .side-label { font-size: 12px; color: var(--muted); padding: 18px 10px 4px; }
  .side-empty { font-size: 12px; color: var(--muted); padding: 4px 10px; margin: 0; }
  .recent { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--line); }
  .me { margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 12px 10px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 600; }

  /* Chat */
  .chat { position: relative; display: grid; grid-template-rows: auto 1fr auto; min-height: 0; overflow: hidden; }
  .chat-head { display: flex; align-items: center; gap: 12px; padding: 12px 24px; border-bottom: 1px solid var(--line); }
  .chat-title { font-weight: 500; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12px; color: var(--muted); background: var(--surface); }
  .thread { overflow-y: auto; padding: 24px; }
  .thread-inner { width: 100%; max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  .hello { text-align: center; padding: 40px 0 8px; display: flex; flex-direction: column; gap: 16px; align-items: center; }
  .hello h1 { font-family: var(--read); font-weight: 400; font-size: 32px; margin: 0; text-wrap: balance; }
  .suggest { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .suggest button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-size: 13px; }
  .suggest button:hover { border-color: var(--accent); }
  .msg-user { align-self: flex-end; max-width: 85%; background: var(--sunk); border: 1px solid var(--line); border-radius: 16px 16px 4px 16px; padding: 12px 16px; white-space: pre-wrap; font-size: 14px; line-height: 1.55; }
  .msg-claude { font-family: var(--read); font-size: 16px; line-height: 1.65; white-space: pre-wrap; }
  .msg-claude .who { font-family: var(--ui); font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; margin-bottom: 6px; white-space: normal; }
  .tag { font-family: var(--ui); font-size: 11px; font-weight: 500; border-radius: 999px; padding: 2px 8px; }
  .tag.before { background: var(--sunk); color: var(--muted); border: 1px solid var(--line); }
  .tag.after { background: var(--green-soft); color: var(--green-ink); }
  .tag.offline { background: var(--accent-soft); color: var(--accent-ink); }
  .notes { margin-top: 12px; font-family: var(--ui); font-size: 13px; line-height: 1.55; background: var(--green-soft); border-radius: 10px; padding: 10px 14px; }
  .notes b { color: var(--green-ink); font-weight: 600; display: block; margin-bottom: 2px; }
  .thinking { color: var(--muted); font-style: italic; }
  .sys { align-self: center; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 12px; font-size: 12px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
  .compare-btn { align-self: center; border: 1px solid var(--accent); color: var(--accent-ink); background: var(--surface); border-radius: 999px; padding: 8px 16px; font-weight: 500; }
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .compare > div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; font-family: var(--read); font-size: 14px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
  .compare h3 { font-family: var(--ui); font-size: 12px; margin: 0 0 8px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .compare .b h3 { color: var(--muted); }
  .compare .a { border-color: var(--green); }
  .compare .a h3 { color: var(--green-ink); }

  .composer-wrap { padding: 12px 24px 20px; }
  .composer { max-width: 720px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 12px 12px 8px 16px; }
  .composer textarea { width: 100%; border: 0; resize: none; background: none; color: var(--text); font: 14px/1.5 var(--ui); min-height: 64px; max-height: 160px; outline: none; }
  .composer-row { display: flex; align-items: center; gap: 8px; }
  .icon-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: 16px; line-height: 1; }
  .send { margin-left: auto; width: 34px; height: 34px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; font-size: 16px; }
  .ftue-on .composer-wrap { opacity: .35; pointer-events: none; }

  /* Guide-me explainables */
  .guide [data-explain] { position: relative; }
  .guide [data-explain]::after {
    content: ""; position: absolute; top: -3px; right: -3px; width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 0 2px var(--bg); pointer-events: none;
  }
  .pop { position: fixed; z-index: 60; max-width: 260px; background: var(--text); color: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.45; box-shadow: var(--shadow); }
  .pop b { display: block; font-weight: 600; margin-bottom: 2px; }
  .pop button { margin-top: 8px; background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 4px 10px; font-size: 12px; font-weight: 500; }

  /* Clawd on the canvas */
  .clawd {
    position: absolute; z-index: 30; left: 0; top: 0; width: 66px; height: 54px;
    transition: left 1.1s ease-in-out, top 1.1s ease-in-out, width .8s ease-in-out, height .8s ease-in-out;
  }
  .clawd[hidden] { display: none !important; }
  .clawd-body { position: absolute; inset: 0; background: none; border: 0; padding: 0; }
  .clawd-body img { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); image-rendering: pixelated; pointer-events: none; transition: width .8s ease-in-out; }
  .clawd.facing-left .clawd-body img { transform: translateX(-50%) scaleX(-1); }

  .say {
    position: absolute; width: max-content; max-width: min(340px, calc(100vw - 48px));
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
    padding: 12px 14px; font-size: 13px; line-height: 1.5; color: var(--text);
  }
  .say[hidden] { display: none !important; }
  .clawd.big .say { top: calc(100% + 14px); left: 50%; transform: translateX(-50%); max-width: min(400px, calc(100vw - 48px)); width: min(400px, calc(100vw - 48px)); }
  .clawd:not(.big) .say { bottom: calc(100% + 10px); right: 0; }
  .say .lead { font-size: 15px; font-weight: 500; margin: 0 0 4px; }
  .say p { margin: 0; }
  .say .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .say input[type="text"] { width: 100%; margin-top: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: 14px var(--ui); background: var(--bg); color: var(--text); }
  .say .skip { display: block; margin-top: 10px; background: none; border: 0; padding: 0; color: var(--muted); font-size: 12px; text-decoration: underline; }
  .choices { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .choice { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 12px; font-size: 13px; }
  .choice:hover { border-color: var(--accent); }
  .choice small { display: block; color: var(--muted); font-size: 12px; }
  .choice.rec { border-color: var(--accent); background: var(--accent-soft); }
  .dots { display: flex; gap: 4px; margin-bottom: 8px; }
  .dots span { width: 18px; height: 4px; border-radius: 2px; background: var(--line); }
  .dots span.on { background: var(--accent); }

  .btn { border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 500; border: 1px solid var(--line); background: var(--surface); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.ghost { border-color: transparent; background: none; color: var(--muted); }

  /* Side panel */
  .panel { border-left: 1px solid var(--line); background: var(--surface); display: grid; grid-template-rows: auto 1fr; min-height: 0; overflow: hidden; }
  .no-panel .panel { border-left: 0; }
  .panel-head { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
  .panel-top { display: flex; align-items: center; gap: 8px; }
  .panel-top h2 { font-size: 14px; font-weight: 600; margin: 0; flex: 1; }
  .close-sheet { display: none; background: none; border: 0; font-size: 20px; line-height: 1; padding: 4px; }
  .levels { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--sunk); border-radius: 10px; padding: 3px; gap: 2px; }
  .levels input { position: absolute; opacity: 0; pointer-events: none; }
  .levels label { text-align: center; font-size: 12px; padding: 6px 4px; border-radius: 8px; color: var(--muted); cursor: pointer; line-height: 1.25; }
  .levels input:checked + label { background: var(--surface); color: var(--text); font-weight: 500; box-shadow: 0 1px 2px rgba(20,20,19,.12); }
  .levels input:focus-visible + label { outline: 2px solid var(--accent); }
  .level-note { font-size: 12px; color: var(--muted); margin: 0; }
  .panel-body { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; }
  .missions { display: flex; flex-direction: column; gap: 8px; }
  .mission { text-align: left; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; }
  .mission:hover:not(:disabled) { border-color: var(--accent); }
  .mission:disabled { opacity: .6; }
  .mission .t { font-weight: 500; font-size: 13px; }
  .mission .d { grid-column: 1; font-size: 12px; color: var(--muted); }
  .mission .m { grid-row: 1 / 3; grid-column: 2; align-self: center; font-size: 11px; color: var(--accent-ink); font-weight: 500; }
  .mission.done { opacity: 1; }
  .mission.done .m { color: var(--green-ink); }
  .tip { font-size: 12px; color: var(--muted); background: var(--sunk); border-radius: 10px; padding: 10px 12px; margin: 0; }

  .lab-head { display: flex; flex-direction: column; gap: 6px; background: var(--sunk); border-radius: 12px; padding: 12px; }
  .lab-head .k { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent-ink); font-weight: 600; }
  .lab-head h3 { margin: 0; font-size: 15px; font-weight: 600; text-wrap: balance; }
  .lab-head p { margin: 0; font-size: 12px; color: var(--muted); }
  .progress { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .progress span { height: 5px; border-radius: 3px; background: var(--line); }
  .progress span.on { background: var(--accent); }
  .q { font-size: 14px; font-weight: 500; margin: 0 0 4px; }
  .q-help { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
  .options { display: flex; flex-direction: column; gap: 6px; }
  .opt { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; font-size: 13px; display: flex; gap: 10px; align-items: center; }
  .opt .box { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--muted); flex: none; }
  .opt.multi .box { border-radius: 4px; }
  .opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .opt[aria-pressed="true"] .box { border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 3px var(--accent-soft); }
  .lab-nav { display: flex; justify-content: space-between; gap: 8px; }
  .win h3 { margin: 0 0 8px; font-size: 16px; }
  .saved { border: 1px solid var(--green); border-radius: 12px; padding: 12px; background: var(--green-soft); font-size: 13px; line-height: 1.5; }
  .saved ul { margin: 6px 0 0; padding-left: 18px; }
  .saved .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

  @media (max-width: 1080px) {
    /* Narrow desktop: the side nav becomes an icon rail */
    .main { grid-template-columns: 60px minmax(0, 1fr) 300px; }
    .main.no-panel { grid-template-columns: 60px minmax(0, 1fr) 0; }
    .sidebar { padding: 12px 8px; }
    .sidebar .lbl, .sidebar .nav-badge, .side-label, #recents, #meName { display: none; }
    .side-top { justify-content: center; padding: 0 0 10px; }
    .side-btn { justify-content: center; padding: 9px 0; }
    .me { justify-content: center; padding-inline: 0; }
  }
  @media (max-width: 760px) {
    .main, .main.no-panel { grid-template-columns: minmax(0, 1fr); }
    /* Phone: the side nav slides in from the left, full labels */
    .sidebar {
      position: fixed; top: 0; bottom: 0; left: 0; width: min(280px, 85vw); z-index: 55;
      padding: calc(16px + env(safe-area-inset-top, 0px)) 12px 16px; box-shadow: var(--shadow);
      transform: translateX(-105%); transition: transform .25s ease;
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar .lbl, .sidebar .nav-badge, .side-label, #recents, #meName { display: revert; }
    .sidebar .side-top .hist, .sidebar .side-top .mode { display: none; }
    .sidebar .side-top { justify-content: space-between; padding: 0 2px 14px; }
    .sidebar .side-btn { justify-content: flex-start; padding: 8px 10px; }
    .sidebar .me { justify-content: flex-start; padding-inline: 8px; }
    .close-nav { display: block; }
    .chat-head .menu-btn { display: grid; }
    .thread, .chat-head { padding-inline: 16px; }
    .composer-wrap { padding: 8px 16px 16px; }
    .hello { padding-top: 24px; }
    .hello h1 { font-size: 26px; }
    .compare { grid-template-columns: 1fr; }
    .panel {
      position: fixed; left: 0; right: 0; bottom: 0; height: 72%; z-index: 50;
      border: 1px solid var(--line); border-radius: 18px 18px 0 0; box-shadow: var(--shadow);
      transform: translateY(105%); transition: transform .25s ease;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .panel.open { transform: translateY(0); }
    .close-sheet { display: block; }
  }
  @media (prefers-reduced-motion: reduce) {
    .clawd { transition: none; }
    .clawd-body img { transition: none; }
    .panel, .sidebar { transition: none; }
  }
</style>

<div class="app">
  <div class="banner" role="note">
    <span><strong>Concept prototype</strong> for the Claude Impact Lab hackathon, Barcelona 2026. Not an Anthropic product.</span>
    <button type="button" id="reset">Restart as a new user</button>
  </div>

  <div class="main ftue-on no-panel" id="main">
    <nav class="sidebar" id="sidebar" aria-label="Main">
      <div class="side-top">
        <button class="top-btn" type="button" aria-label="Toggle sidebar"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9.5 4.5v15"/></svg></button>
        <span class="lbl hist">
          <button class="top-btn" type="button" aria-label="Back"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
          <button class="top-btn dim" type="button" aria-label="Forward"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        </span>
        <span class="lbl mode" role="group" aria-label="Mode">
          <button class="mode-btn on" type="button" aria-label="Chat"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h10a2 2 0 0 1 2 2V13a2 2 0 0 1-2 2H9l-3.5 3v-3H4a2 2 0 0 1-2-2V7.5a2 2 0 0 1 2-2z"/><path d="M16 9h4a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-.5v2.5L16.5 18H13a2 2 0 0 1-2-2"/></svg></button>
          <button class="mode-btn" type="button" aria-label="Code"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 7 3.5 12l5 5M15.5 7l5 5-5 5M13.5 5l-3 14"/></svg></button>
        </span>
        <button class="close-nav" type="button" id="closeNav" aria-label="Close menu">&times;</button>
      </div>
      <button class="side-btn new" type="button"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">New</span></button>
      <button class="side-btn clawd-nav" type="button" id="navClawd"><span class="mini-clawd"><img src="clawd/icon.png" alt=""></span><span class="lbl">Clawd</span><span class="nav-badge">Lab</span></button>
      <button class="side-btn" type="button" data-explain="projects"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h16V17a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z"/><path d="M5.5 5.5h13"/></svg><span class="lbl">Projects</span></button>
      <button class="side-btn" type="button" data-explain="artifacts"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8" r="3.5"/><path d="M8 11.5 4 19.5h8z"/><rect x="13.5" y="10.5" width="6.5" height="9" rx="1.5"/></svg><span class="lbl">Artifacts</span></button>
      <button class="side-btn" type="button" data-explain="scheduled"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span class="lbl">Scheduled</span></button>
      <button class="side-btn" type="button" data-explain="design"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5a8.5 8.5 0 1 0 0 17c1.2 0 1.7-1 1.2-1.9-.6-1.1 0-2.3 1.3-2.3h2A3.9 3.9 0 0 0 20.5 12c0-4.7-3.8-8.5-8.5-8.5z"/><circle cx="7.8" cy="11" r="1"/><circle cx="10.5" cy="7.5" r="1"/><circle cx="15" cy="8" r="1"/></svg><span class="lbl">Design</span></button>
      <button class="side-btn" type="button" data-explain="customize"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="7.5" width="17" height="12" rx="2"/><path d="M9 7.5V6a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 6v1.5M3.5 12.5h17"/></svg><span class="lbl">Customize</span></button>
      <button class="side-btn more" type="button"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg><span class="lbl">More</span></button>
      <div class="side-label">Recents</div>
      <div id="recents"><p class="side-empty">Your chats will appear here.</p></div>
      <div class="me"><span class="avatar" id="avatar">?</span> <span id="meName">Guest</span></div>
    </nav>

    <section class="chat" id="chat" aria-label="Conversation">
      <header class="chat-head">
        <button class="icon-btn menu-btn" type="button" id="menuBtn" aria-label="Open menu">&#9776;</button>
        <span class="chat-title" id="chatTitle">New chat</span>
        <span class="pill" data-explain="model">Claude Sonnet</span>
        <button class="pill" type="button" id="clawdBack" hidden>Clawd is off</button>
      </header>

      <div class="thread" id="thread">
        <div class="thread-inner" id="threadInner"></div>
      </div>

      <div class="composer-wrap" id="composerWrap">
        <form class="composer" id="composer">
          <textarea id="prompt" rows="4" aria-label="Message Claude" placeholder="How can I help you today?"></textarea>
          <div class="composer-row">
            <button class="icon-btn" type="button" data-explain="attach" aria-label="Add a file">+</button>
            <button class="icon-btn" type="button" data-explain="connectors" aria-label="Connectors">&#8651;</button>
            <button class="send" id="send" type="submit" aria-label="Send">&#8593;</button>
          </div>
        </form>
      </div>

      <div class="clawd big" id="clawd">
        <button class="clawd-body" type="button" id="clawdBody" aria-label="Clawd"><img id="clawdImg" src="clawd/idle.webp" alt=""></button>
        <div class="say" id="say" role="status" hidden></div>
      </div>
    </section>

    <aside class="panel" id="panel" aria-label="Clawd settings and Lab">
      <div class="panel-head">
        <div class="panel-top">
          <h2>Clawd</h2>
          <button class="close-sheet" type="button" id="closeSheet" aria-label="Close">&times;</button>
        </div>
        <div class="levels" role="radiogroup" aria-label="How much help">
          <input type="radio" name="level" id="lv-guide" value="guide" checked><label for="lv-guide">Guide me</label>
          <input type="radio" name="level" id="lv-useful" value="useful"><label for="lv-useful">Only when useful</label>
          <input type="radio" name="level" id="lv-off" value="off"><label for="lv-off">Off</label>
        </div>
        <p class="level-note" id="levelNote"></p>
      </div>
      <div class="panel-body" id="panelBody"></div>
    </aside>
  </div>
</div>

<div class="pop" id="pop" hidden role="tooltip"></div>

<script>
(() => {
  // ---------- Content ----------
  const DRAFT = `Estimado Sr. Puig:

Gracias por avisarnos. Hemos revisado la factura n.º 2026-0418 del 12 de septiembre. El importe correcto es 1.180,00 €, como en el presupuesto aceptado; los 60,00 € de diferencia eran gastos de envío que no debimos incluir. Le enviaremos la factura corregida el viernes.

Disculpe las molestias.

Un saludo,
Carmen López
Administración`;
  const REQUEST = "Translate this to Catalan:\n\n" + DRAFT;

  const OFFLINE_BEFORE = `Aquí tens la traducció al català:

Benvolgut Sr. Puig:

Gràcies per avisar-nos. Hem revisat la factura núm. 2026-0418 del 12 de setembre. L'import correcte és 1.180,00 €, com en el pressupost acceptat; els 60,00 € de diferència eren despeses d'enviament que no havíem d'incloure. Li enviarem la factura corregida divendres.

Disculpi les molèsties.

Salutacions,
Carmen López
Administració

Si vols, també puc fer-lo més formal o adaptar-lo a un altre to. Vols que hi afegeixi alguna cosa més?`;

  const OFFLINE_AFTER = `Benvolgut Sr. Puig,

Gràcies per fer-nos-ho saber. Hem revisat la factura núm. 2026-0418, del 12 de setembre. L'import correcte és d'1.180,00 €, tal com figura al pressupost acceptat. Els 60,00 € de diferència corresponien a despeses d'enviament que no s'havien d'incloure. Li enviarem la factura corregida divendres.

Li demanem disculpes per les molèsties.

Atentament,
Carmen López
Administració
---
Notes for you
• "divendres" (Friday): Sr. Puig may not know which Friday. Consider "divendres 26 de setembre".
• The invoice number, amounts and dates are unchanged.`;

  const EXPLAIN = {
    projects:   ["Projects", "A folder where Claude keeps the files and instructions for one piece of work.", null],
    artifacts:  ["Artifacts", "Things Claude made for you that you can keep, like a document, a table or a small app.", null],
    scheduled:  ["Scheduled", "Tasks Claude does for you at set times, like a Monday summary of your emails.", null],
    design:     ["Design", "A canvas where Claude helps you make visuals, like a poster or a slide.", null],
    customize:  ["Customize", "Tell Claude how to talk to you and what to remember about you. The Lab fills this in for you.", null],
    model:      ["Claude Sonnet", "Which version of Claude answers you. You don't need to change this.", null],
    attach:     ["Add a file", "Add a photo or a PDF, like a letter or an invoice, for Claude to read.", null],
    connectors: ["Connectors", "Let Claude look things up in apps you already use, like your email or calendar.", null],
    memory:     ["Memory updated", "Claude saved something about you, so you don't have to repeat it every time.", null],
    skill:      ["Skill saved", "A recipe Claude follows every time you ask for this task.", null]
  };

  const MISSIONS = [
    { id: "clients", t: "Teach Claude how you write to clients", d: "Your tone and rules. 2 min", ready: true },
    { id: "you", t: "Tell Claude about your work", d: "Your role and languages. 1 min", ready: false },
    { id: "connect", t: "Connect a tool you use", d: "Claude reads your calendar. 3 min", ready: false }
  ];

  const STEPS = [
    { key: "role", q: "Who are you when you write to clients?", help: "Pick the closest one.", multi: false,
      options: ["Office admin", "Accounts", "Sales", "Reception"] },
    { key: "tone", q: "How should your emails sound?", help: "Claude will write every client email this way.", multi: false,
      options: ["Warm and formal (vostè)", "Friendly (tu)", "Short and direct"] },
    { key: "rules", q: "What must never go wrong?", help: "Pick as many as you like.", multi: true,
      options: ["Keep prices and dates exactly as I wrote them", "Flag anything a client could misread", "Only give me the email, ready to paste", "Keep my signature"] }
  ];

  const LEVELS = {
    guide:  ["Guide me", "I explain things as you go and suggest short lessons."],
    useful: ["Only when useful", "I stay quiet and only show up when I can save you time."],
    off:    ["Off", "No tips, no suggestions. You can turn me back on any time."]
  };

  // ---------- State ----------
  const fresh = () => ({
    ftue: 0, name: "", intent: null,
    phase: "start", view: "home", step: 0,
    answers: { role: null, tone: null, rules: [] },
    dismissals: 0, noSuggest: false, before: "", after: ""
  });
  let S = fresh();
  let level = "guide";
  let sample = null;
  let busy = false;

  const $ = (id) => document.getElementById(id);
  const main = $("main"), chat = $("chat"), thread = $("threadInner"), prompt = $("prompt");
  const panel = $("panel"), body = $("panelBody"), pop = $("pop"), clawd = $("clawd"), say = $("say");
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const mobile = () => matchMedia("(max-width: 760px)").matches;
  const who = () => S.name || "there";

  // Clawd animations: transparent WebPs made from the team's clips in /animations.
  // Every clip is drawn at 4 image pixels per art pixel, so one scale fits all.
  const SIZES = { idle: 53, hop: 49, walk: 52, workout: 79, celebrate: 89, flag: 69 };
  const ONCE = { hop: 2160, celebrate: 4230, flag: 4400 };
  const IDLE_H = 43;
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
  const img = $("clawdImg");
  let base = "idle", cur = "idle", walking = false;
  const scale = () => S.ftue !== "done" ? 2 : mobile() ? 1 : 1.25;
  function show(name) {
    cur = name;
    img.src = reduceMotion.matches ? "clawd/icon.png" : "clawd/" + name + ".webp" + (ONCE[name] ? "?play=" + Date.now() : "");
    img.style.width = (reduceMotion.matches ? SIZES.idle : SIZES[name]) * scale() + "px";
  }
  function setBase(name) { base = name; if (!walking && !ONCE[cur]) show(name); }
  function play(name) {
    clearTimeout(play.t);
    show(name);
    play.t = setTimeout(() => { if (!walking) show(base); }, ONCE[name]);
  }

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("sample").then((s) => { sample = s; }).catch(() => {});
  }

  // ---------- Clawd placement ----------
  let lastLeft = null;
  function placeClawd(instant) {
    if (instant === true || lastLeft === null) {
      clawd.style.transition = "none";
      requestAnimationFrame(() => requestAnimationFrame(() => { clawd.style.transition = ""; }));
    }
    const c = chat.getBoundingClientRect();
    const w = SIZES.idle * scale(), h = IDLE_H * scale();
    clawd.style.width = w + "px"; clawd.style.height = h + "px";
    img.style.width = (reduceMotion.matches ? SIZES.idle : SIZES[cur]) * scale() + "px";
    let left, top;
    if (S.ftue !== "done") {
      left = (c.width - w) / 2;
      top = Math.max(76, c.height * 0.1);
    } else {
      const comp = $("composer").getBoundingClientRect();
      left = comp.right - c.left - w - 24;
      top = comp.top - c.top - h + 6;
    }
    if (lastLeft !== null && Math.abs(left - lastLeft) > 4 && instant !== true) {
      // The walk clip faces right; mirror it when Clawd heads left.
      clawd.classList.toggle("facing-left", left < lastLeft);
      walking = true; clearTimeout(play.t); show("walk");
      clearTimeout(placeClawd.t);
      placeClawd.t = setTimeout(() => { walking = false; clawd.classList.remove("facing-left"); show(base); }, 1150);
    }
    lastLeft = left;
    clawd.style.left = left + "px";
    clawd.style.top = top + "px";
  }
  addEventListener("resize", () => placeClawd(true));

  function speak(html) {
    if (!html) { say.hidden = true; say.innerHTML = ""; return; }
    say.innerHTML = html;
    say.hidden = false;
  }

  // ---------- First-time experience ----------
  function ftueDots(i) { return `<div class="dots">${[0, 1, 2].map((n) => `<span class="${n <= i ? "on" : ""}"></span>`).join("")}</div>`; }

  function renderFtue() {
    main.classList.add("ftue-on", "no-panel");
    clawd.classList.add("big");
    clawd.hidden = false;
    placeClawd();
    if (S.ftue === 0) {
      speak(`${ftueDots(0)}<p class="lead">Hola! I'm Clawd.</p>
        <p>I help you get good results from Claude, one small step at a time. No account needed. What should I call you?</p>
        <form id="nameForm"><input type="text" id="nameInput" autocomplete="given-name" placeholder="Your first name" aria-label="Your first name">
        <div class="actions"><button class="btn primary" type="submit">Continue</button></div></form>
        <button class="skip" type="button" data-ftue="skip">Skip the intro</button>`);
      setTimeout(() => $("nameInput")?.focus(), 50);
    } else if (S.ftue === 1) {
      speak(`${ftueDots(1)}<p class="lead">Nice to meet you, ${esc(who())}.</p><p>What brings you here today?</p>
        <div class="choices">
          <button class="choice" data-intent="task">I have something to get done<small>I'll get out of your way</small></button>
          <button class="choice" data-intent="learn">I want to learn how AI can help me<small>I'll show you around</small></button>
          <button class="choice" data-intent="look">Just looking around</button>
        </div>
        <button class="skip" type="button" data-ftue="skip">Skip the intro</button>`);
    } else if (S.ftue === 2) {
      const rec = S.intent === "task" ? "useful" : "guide";
      speak(`${ftueDots(2)}<p class="lead">How much should I help while you work?</p><p>You can change this any time in my panel.</p>
        <div class="choices">${["guide", "useful", "off"].map((k) =>
          `<button class="choice ${k === rec ? "rec" : ""}" data-level="${k}">${LEVELS[k][0]}${k === rec ? " (suggested)" : ""}<small>${LEVELS[k][1]}</small></button>`).join("")}
        </div>`);
    }
  }

  function finishFtue(chosenLevel) {
    speak("");
    play("flag");
    setTimeout(() => settle(chosenLevel), 1800);
  }

  function settle(chosenLevel) {
    S.ftue = "done";
    main.classList.remove("ftue-on");
    clawd.classList.remove("big");
    $("avatar").textContent = S.name ? S.name[0].toUpperCase() : "?";
    $("meName").textContent = S.name || "Guest";
    renderHello();
    setLevel(chosenLevel);
    setTimeout(() => {
      if (level === "off") return;
      if (S.intent === "learn") {
        speakSmall(`Here's my Lab. Pick a mission when you have two minutes, or just start chatting.`);
        if (mobile()) panel.classList.add("open");
      } else if (level === "guide") {
        speakSmall(`I'll sit here. Tap anything with an orange dot and I'll explain it in one line.`, true);
      }
    }, 1200);
  }

  say.addEventListener("submit", (e) => {
    if (e.target.id !== "nameForm") return;
    e.preventDefault();
    S.name = ($("nameInput").value || "").trim().slice(0, 40);
    S.ftue = 1; renderFtue();
  });

  // ---------- Hello and chat ----------
  function renderHello() {
    const h = new Date().getHours();
    const part = h < 12 ? "Good morning" : h < 20 ? "Good afternoon" : "Good evening";
    thread.innerHTML = `<div class="hello" id="hello"><h1>${part}${S.name ? ", " + esc(S.name) : ""}</h1>
      <div class="suggest">
        <button type="button" data-suggest="translate">Translate an email to Catalan</button>
        <button type="button" data-suggest="other">Reply to a client</button>
        <button type="button" data-suggest="other">Explain a document</button>
      </div></div>`;
  }

  thread.addEventListener("click", (e) => {
    const s = e.target.closest("[data-suggest]");
    if (!s) return;
    if (s.dataset.suggest === "translate") {
      prompt.value = REQUEST;
      prompt.focus();
    } else {
      prompt.value = s.textContent + ": ";
      prompt.focus();
    }
  });

  function afterPrompt(text) {
    const a = S.answers;
    const rules = a.rules.length ? a.rules.map((r) => "- " + r).join("\n") : "- (none given)";
    return `You are helping ${S.name || "the user"}, who writes to clients at work. They saved these standing preferences:
- Role: ${a.role || "Office admin"}
- Tone for client emails: ${a.tone || "Warm and formal (vostè)"}
Rules they set:
${rules}

Their request:
${text}

Reply with only the finished email in Catalan, ready to paste, with no preamble and no closing offer. Then a line containing only "---", then a short section starting with the line "Notes for you", written in English, with at most 3 bullets: anything in the original a client could misread, and a confirmation that numbers and dates are unchanged.`;
  }

  function renderAnswer(el, text) {
    const i = text.indexOf("\n---");
    const m = i >= 0 ? text.slice(0, i).trim() : text;
    const notes = i >= 0 ? text.slice(i + 4).trim().replace(/^Notes for you\s*/i, "") : "";
    el.innerHTML = esc(m) + (notes ? `<div class="notes"><b>Notes for you</b>${esc(notes)}</div>` : "");
  }

  function typeOut(el, text, done) {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) { renderAnswer(el, text); done(); return; }
    let n = 0;
    const t = setInterval(() => {
      n = Math.min(text.length, n + 18);
      renderAnswer(el, text.slice(0, n));
      scrollDown();
      if (n >= text.length) { clearInterval(t); done(); }
    }, 30);
  }

  async function ask(input, fallback, el, whoEl) {
    const offline = () => {
      whoEl.insertAdjacentHTML("beforeend", `<span class="tag offline">Example answer, offline</span>`);
      return new Promise((res) => typeOut(el, fallback, () => res(fallback)));
    };
    if (!sample) return offline();
    el.innerHTML = `<span class="thinking">Thinking...</span>`;
    try {
      const { text } = await sample(input, { modelTier: "quick", onText: ({ text }) => { renderAnswer(el, text); scrollDown(); } });
      return text;
    } catch (e) { return offline(); }
  }

  function scrollDown() { const t = $("thread"); t.scrollTop = t.scrollHeight; }

  function addUser(text) {
    $("hello")?.remove();
    const d = document.createElement("div");
    d.className = "msg-user";
    d.textContent = text;
    thread.append(d);
  }

  function addClaude(kind) {
    const w = document.createElement("div");
    w.className = "msg-claude";
    w.innerHTML = `<div class="who">Claude <span class="tag ${kind}">${kind === "after" ? "After the Lab" : "Before"}</span></div><div class="ans"></div>`;
    thread.append(w);
    scrollDown();
    return [w.querySelector(".ans"), w.querySelector(".who")];
  }

  $("composer").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const text = prompt.value.trim();
    if (!text || busy || S.ftue !== "done") return;
    busy = true; $("send").disabled = true;
    speak("");
    const isAfter = S.phase === "saved";
    if (S.phase === "start") {
      $("chatTitle").textContent = "Translate client email";
      $("recents").innerHTML = `<button class="side-btn recent" type="button">Translate client email</button>`;
    }
    addUser(text);
    prompt.value = "";
    const [el, whoEl] = addClaude(isAfter ? "after" : "before");
    const out = await ask(isAfter ? afterPrompt(text) : text, isAfter ? OFFLINE_AFTER : OFFLINE_BEFORE, el, whoEl);
    busy = false; $("send").disabled = false;
    if (isAfter) {
      S.after = out; S.phase = "after";
      const b = document.createElement("button");
      b.type = "button"; b.className = "compare-btn"; b.textContent = "Compare before and after";
      b.addEventListener("click", () => { b.remove(); showCompare(); });
      thread.append(b);
      S.view = "home"; renderPanel();
      if (level !== "off") { play("hop"); }
      if (level !== "off") speakSmall(`Same email, same request. This time I knew how you write to clients.`, true);
    } else {
      S.before = out; S.phase = "before";
      setTimeout(nudge, 900);
    }
    scrollDown();
  });

  function showCompare() {
    const strip = (t) => { const i = t.indexOf("\n---"); return i >= 0 ? t.slice(0, i).trim() : t; };
    const d = document.createElement("div");
    d.className = "compare";
    d.innerHTML = `<div class="b"><h3>Before</h3>${esc(S.before)}</div><div class="a"><h3>After the Lab</h3>${esc(strip(S.after))}</div>`;
    thread.append(d);
    scrollDown();
  }

  // ---------- Clawd speaking on the canvas ----------
  function speakSmall(text, closable, actions = "") {
    speak(`<p>${esc(text)}</p>${actions ? `<div class="actions">${actions}</div>` : ""}${closable ? `<button class="skip" type="button" data-act="hush">Got it</button>` : ""}`);
  }

  function nudge() {
    if (level === "off" || S.noSuggest || S.phase !== "before") return;
    clawd.hidden = false;
    placeClawd();
    play("hop");
    speakSmall(`That's a word-for-word translation. Tell me how you write to clients and I'll get it right every time. Two minutes?`, false,
      `<button class="btn primary" data-act="lab">Teach me in the Lab</button><button class="btn" data-act="later">Not now</button><button class="btn ghost" data-act="never">Don't suggest this again</button>`);
  }

  function setLevel(v) {
    level = v;
    $("lv-" + v).checked = true;
    main.classList.toggle("guide", v === "guide");
    main.classList.toggle("no-panel", v === "off");
    $("clawdBack").hidden = v !== "off";
    if (v === "off") { hidePop(); panel.classList.remove("open"); speak(""); }
    // "Only when useful": Clawd is off-canvas until a moment worth interrupting for.
    clawd.hidden = v === "off" || (v === "useful" && S.phase !== "before" && S.view !== "lab" && S.view !== "done");
    placeClawd();
    renderPanel();
  }

  // ---------- Side panel ----------
  function renderPanel() {
    $("levelNote").textContent = LEVELS[level][1];
    if (level === "off") { body.innerHTML = ""; return; }
    if (S.view === "lab") return renderLab();
    if (S.view === "done") return renderDone();
    const doneClients = S.phase === "saved" || S.phase === "after";
    body.innerHTML = (level === "guide" ? `<p class="tip">Tap anything with an orange dot for a one-line explanation.</p>` : "") +
      `<div><p class="section-label">Lab missions</p><div class="missions">` + MISSIONS.map((m) => {
        const done = m.id === "clients" && doneClients;
        return `<button class="mission ${done ? "done" : ""}" data-mission="${m.id}" ${m.ready && !done ? "" : "disabled"}>
          <span class="t">${m.t}</span><span class="d">${m.d}</span><span class="m">${done ? "Done" : m.ready ? "Start" : "Soon"}</span></button>`;
      }).join("") + `</div></div>`;
  }

  function renderLab() {
    const st = STEPS[S.step];
    const val = S.answers[st.key];
    const picked = (o) => st.multi ? val.includes(o) : val === o;
    const canNext = st.multi ? val.length > 0 : !!val;
    body.innerHTML = `
      <div class="lab-head">
        <span class="k">Lab · separate conversation</span>
        <h3>Teach Claude how you write to clients</h3>
        <p>Practice here never touches your real chat. You keep what you save.</p>
        <div class="progress">${STEPS.map((_, i) => `<span class="${i <= S.step ? "on" : ""}"></span>`).join("")}</div>
      </div>
      <div>
        <p class="q">${esc(st.q)}</p>
        <p class="q-help">${esc(st.help)}</p>
        <div class="options">${st.options.map((o) =>
          `<button type="button" class="opt ${st.multi ? "multi" : ""}" data-opt="${esc(o)}" aria-pressed="${picked(o)}"><span class="box"></span>${esc(o)}</button>`).join("")}</div>
      </div>
      <div class="lab-nav">
        <button class="btn ghost" data-act="${S.step === 0 ? "quit" : "back"}">${S.step === 0 ? "Leave the Lab" : "Back"}</button>
        <button class="btn primary" data-act="next" ${canNext ? "" : "disabled"}>${S.step === STEPS.length - 1 ? "Save" : "Next"}</button>
      </div>`;
  }

  function renderDone() {
    const a = S.answers;
    body.innerHTML = `
      <div class="win">
        <h3>Mission complete</h3>
        <div class="saved">
          <strong>From now on, Claude will:</strong>
          <ul>
            <li>know you write to clients as ${esc(a.role.toLowerCase())}</li>
            <li>use this tone: ${esc(a.tone.toLowerCase())}</li>
            ${a.rules.map((r) => `<li>${esc(r.charAt(0).toLowerCase() + r.slice(1))}</li>`).join("")}
          </ul>
          <div class="row">
            <span class="chip" data-explain="memory"><span class="dot"></span>Memory updated</span>
            <span class="chip" data-explain="skill"><span class="dot"></span>Skill saved: client email to Catalan</span>
          </div>
        </div>
      </div>
      <button class="btn primary" data-act="try">Try it on your email</button>`;
  }

  function openLab() {
    S.view = "lab"; S.step = 0;
    clawd.hidden = false; placeClawd();
    setBase("workout");
    speakSmall(`We're in the Lab now. Nothing here touches your chat.`, true);
    renderPanel();
    if (mobile()) panel.classList.add("open");
  }

  function addSaved() {
    const d = document.createElement("div");
    d.className = "sys";
    d.innerHTML = `<span class="chip" data-explain="memory"><span class="dot"></span>Memory updated</span><span class="chip" data-explain="skill"><span class="dot"></span>Skill saved</span>`;
    thread.append(d);
    scrollDown();
  }

  // ---------- Actions (canvas bubble and panel share them) ----------
  function act(a) {
    if (a === "skip") { S.intent = "task"; finishFtue("useful"); return; }
    if (a === "hush") { speak(""); return; }
    if (a === "lab") { openLab(); return; }
    if (a === "later" || a === "never") {
      S.dismissals++;
      if (a === "never") S.noSuggest = true;
      if (S.dismissals >= 2 && level === "guide") {
        speakSmall(`Looks like you'd rather get on with your work. Want me to show up only when it's useful?`, false,
          `<button class="btn primary" data-act="stepdown">Only when useful</button><button class="btn ghost" data-act="keep">Keep guiding me</button>`);
      } else {
        speak("");
        if (level === "useful") { clawd.hidden = true; }
      }
      return;
    }
    if (a === "stepdown") { S.dismissals = 0; speak(""); setLevel("useful"); return; }
    if (a === "keep") { S.dismissals = 0; speak(""); return; }
    if (a === "quit") { S.view = "home"; speak(""); setBase("idle"); renderPanel(); if (level === "useful") clawd.hidden = true; return; }
    if (a === "back") { S.step--; renderLab(); return; }
    if (a === "next") {
      if (S.step < STEPS.length - 1) { S.step++; renderLab(); }
      else {
        S.phase = "saved"; S.view = "done"; renderPanel(); addSaved();
        base = "idle"; play("celebrate");
        speakSmall(`Saved! I'll remember this every time you write to a client.`, true);
      }
      return;
    }
    if (a === "try") {
      panel.classList.remove("open");
      S.view = "home"; renderPanel();
      prompt.value = REQUEST;
      $("composer").requestSubmit();
    }
  }

  say.addEventListener("click", (e) => {
    const f = e.target.closest("[data-ftue]"); if (f) { act(f.dataset.ftue); return; }
    const i = e.target.closest("[data-intent]"); if (i) { S.intent = i.dataset.intent; S.ftue = 2; renderFtue(); return; }
    const l = e.target.closest("[data-level]"); if (l) { finishFtue(l.dataset.level); return; }
    const a = e.target.closest("[data-act]"); if (a) act(a.dataset.act);
  });

  body.addEventListener("click", (e) => {
    const opt = e.target.closest("[data-opt]");
    if (opt) {
      const st = STEPS[S.step], o = opt.dataset.opt;
      if (st.multi) {
        const arr = S.answers[st.key];
        S.answers[st.key] = arr.includes(o) ? arr.filter((x) => x !== o) : [...arr, o];
      } else S.answers[st.key] = o;
      renderLab();
      return;
    }
    const m = e.target.closest("[data-mission]");
    if (m && !m.disabled) { openLab(); return; }
    const a = e.target.closest("[data-act]");
    if (a) act(a.dataset.act);
  });

  $("clawdBody").addEventListener("click", () => {
    if (S.ftue !== "done") return;
    if (mobile()) { panel.classList.toggle("open"); return; }
    if (!say.hidden) { speak(""); return; }
    speakSmall(level === "guide"
      ? `Tap anything with an orange dot and I'll explain it. My Lab is in the panel on the right.`
      : `I'm here if you need me. My Lab and settings are in the panel on the right.`, true);
  });

  // ---------- Explain popovers ----------
  let popFor = null;
  function showPop(el) {
    const [title, text] = EXPLAIN[el.dataset.explain] || [];
    if (!title) return;
    popFor = el;
    pop.innerHTML = `<b>${esc(title)}</b>${esc(text)}${S.phase === "start" || S.phase === "before" ? `<br><button type="button" data-lab>Try it in the Lab</button>` : ""}`;
    pop.hidden = false;
    const r = el.getBoundingClientRect(), p = pop.getBoundingClientRect();
    const left = Math.min(Math.max(8, r.left), innerWidth - p.width - 8);
    let top = r.bottom + 8;
    if (top + p.height > innerHeight - 8) top = r.top - p.height - 8;
    pop.style.left = left + "px"; pop.style.top = top + "px";
  }
  function hidePop() { pop.hidden = true; popFor = null; }

  document.addEventListener("click", (e) => {
    if (e.target.closest("[data-lab]")) { hidePop(); openLab(); return; }
    if (e.target.closest("#pop")) return;
    const el = e.target.closest("[data-explain]");
    if (el && level === "guide" && S.ftue === "done") { e.preventDefault(); popFor === el ? hidePop() : showPop(el); return; }
    hidePop();
  });
  document.addEventListener("mouseover", (e) => {
    if (level !== "guide" || S.ftue !== "done" || !matchMedia("(hover: hover)").matches) return;
    const el = e.target.closest("[data-explain]");
    if (el && el !== popFor) showPop(el);
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") hidePop(); });
  $("thread").addEventListener("scroll", hidePop);

  // ---------- Wiring ----------
  document.querySelectorAll('input[name="level"]').forEach((r) => r.addEventListener("change", () => setLevel(r.value)));
  $("clawdBack").addEventListener("click", () => setLevel("useful"));
  // The nav entry is the always-there way back to Clawd, even when it is set to Off.
  $("navClawd").addEventListener("click", () => {
    if (S.ftue !== "done") return;
    if (level === "off") setLevel("useful");
    if (S.view === "home" && S.phase !== "saved" && S.phase !== "after") openLab();
    else { clawd.hidden = false; placeClawd(); speakSmall(`Here's my Lab and settings, in the panel on the right.`, true); }
  });
  $("closeSheet").addEventListener("click", () => panel.classList.remove("open"));
  $("menuBtn").addEventListener("click", () => $("sidebar").classList.add("open"));
  $("closeNav").addEventListener("click", () => $("sidebar").classList.remove("open"));
  $("sidebar").addEventListener("click", (e) => { if (e.target.closest("#navClawd")) $("sidebar").classList.remove("open"); });
  $("reset").addEventListener("click", start);

  function start() {
    S = fresh();
    level = "guide";
    $("lv-guide").checked = true;
    main.classList.add("guide");
    $("clawdBack").hidden = true;
    panel.classList.remove("open");
    hidePop();
    thread.innerHTML = "";
    prompt.value = "";
    $("chatTitle").textContent = "New chat";
    $("recents").innerHTML = `<p class="side-empty">Your chats will appear here.</p>`;
    $("avatar").textContent = "?"; $("meName").textContent = "Guest";
    lastLeft = null;
    base = "idle"; walking = false; clearTimeout(play.t); clearTimeout(placeClawd.t);
    clawd.classList.remove("facing-left");
    show("idle");
    renderPanel();
    renderFtue();
  }

  start();
})();
</script>
