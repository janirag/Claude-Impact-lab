<!doctype html>
<html><head><meta charset="utf-8"><title>Foto carta</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 35% 30%, #b98a5e 0%, #8a5f3b 60%, #6b4629 100%);
    display: grid; place-items: center;
  }
  img {
    width: 760px; transform: rotate(-2.2deg) perspective(1400px) rotateX(4deg);
    box-shadow: 0 18px 40px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
    filter: brightness(.97) contrast(.96) sepia(.08);
  }
  .glare { position: fixed; inset: 0; background: linear-gradient(115deg, rgba(255,255,255,.18) 0%, rgba(255,255,255,0) 40%, rgba(0,0,0,.12) 100%); }
</style></head>
<body><img src="../png/carta-ibi.png" alt=""><div class="glare"></div></body></html>
